<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover">

    <title>ZenPlay</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #08090d;
            color: white;
        }

        body {
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            font-size: 3rem;
            margin: 0 0 10px;
        }

        .subtitle {
            color: #9da3b4;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(240px, 1fr)
            );
            gap: 20px;
        }

        .game {
            padding: 25px;
            border-radius: 18px;
            background: #11131a;
            border: 1px solid #242733;
            color: white;
            cursor: pointer;
            transition:
                transform 0.2s,
                border-color 0.2s;
        }

        .game:hover {
            transform: translateY(-4px);
            border-color: #4d556b;
        }

        .game h2 {
            margin: 0 0 10px;
        }

        .game p {
            margin: 0 0 15px;
            color: #9da3b4;
            line-height: 1.5;
        }

        .game-info {
            font-size: 0.85rem;
            color: #6f7688;
        }

        /* Game overlay */

        #gameOverlay {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            background: #000;

            display: none;

            z-index: 1000;

            overflow: hidden;

            touch-action: none;
        }

        #gameFrame {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            border: none;

            display: block;

            background: #000;

            z-index: 1001;

            touch-action: auto;
        }

        /* Exit button */

        #exitButton {
            position: fixed;

            top: calc(16px + env(safe-area-inset-top));
            right: calc(16px + env(safe-area-inset-right));

            z-index: 1003;

            padding: 10px 16px;

            border: none;
            border-radius: 10px;

            background: rgba(20, 20, 25, 0.85);
            color: white;

            font-size: 15px;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            pointer-events: auto;

            user-select: none;
            -webkit-user-select: none;

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        #exitButton:hover {
            background: rgba(40, 40, 48, 0.95);
        }

        /* Black page while playing */

        body.playing {
            background: #000;
            padding: 0;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>ZenPlay</h1>

    <p class="subtitle">
        Simple, satisfying games.
    </p>

    <div class="games" id="games">
        Loading games...
    </div>

</div>

<!-- Game overlay -->

<div id="gameOverlay">

    <button
        id="exitButton"
        type="button">
        Exit
    </button>

    <iframe
        id="gameFrame"
        allow="fullscreen">
    </iframe>

</div>

<script>

const gamesContainer =
    document.getElementById("games");

const gameOverlay =
    document.getElementById("gameOverlay");

const gameFrame =
    document.getElementById("gameFrame");

let exitButton =
    document.getElementById("exitButton");

let savedScrollPosition = 0;

let gameOpen = false;

let rebuildTimer = null;


/*
    Load games
*/

async function loadGames() {

    try {

        const response =
            await fetch("games.json");

        if (!response.ok) {
            throw new Error(
                "Could not load games.json"
            );
        }

        const data =
            await response.json();

        gamesContainer.innerHTML = "";

        data.games.forEach(game => {

            const card =
                document.createElement("div");

            card.className = "game";

            card.onclick = () => {
                openGame(game.file);
            };

            card.innerHTML = `
                <h2>${game.name}</h2>

                <p>
                    ${game.description}
                </p>

                <div class="game-info">
                    ${game.category} · ${game.type}
                </div>
            `;

            gamesContainer.appendChild(card);

        });

    } catch (error) {

        gamesContainer.innerHTML =
            "Unable to load games.";

        console.error(error);

    }
}


/*
    Update viewport dimensions
*/

function updateGameViewport() {

    if (!gameOpen) {
        return;
    }

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;

    gameOverlay.style.width =
        width + "px";

    gameOverlay.style.height =
        height + "px";

    gameFrame.style.width =
        width + "px";

    gameFrame.style.height =
        height + "px";

    /*
        Force WebKit to recalculate
        the layout.
    */

    void document.documentElement.offsetHeight;

    void document.body.offsetHeight;

    void gameOverlay.offsetWidth;

    void gameOverlay.offsetHeight;

    void gameFrame.offsetWidth;

    void gameFrame.offsetHeight;
}


/*
    Rebuild Exit button
*/

function rebuildExitButton() {

    if (!gameOpen) {
        return;
    }

    const oldButton =
        document.getElementById("exitButton");

    if (oldButton) {
        oldButton.remove();
    }

    const newButton =
        document.createElement("button");

    newButton.id =
        "exitButton";

    newButton.type =
        "button";

    newButton.textContent =
        "Exit";

    /*
        Pointer event.

        This is the primary touch
        path on modern iOS.
    */

    newButton.addEventListener(
        "pointerup",
        event => {

            event.preventDefault();
            event.stopPropagation();

            if (gameOpen) {
                closeGame();
            }

        },
        {
            passive: false
        }
    );

    /*
        Touch fallback.

        This gives WebKit a fresh native
        touch target as well.
    */

    newButton.addEventListener(
        "touchend",
        event => {

            event.preventDefault();
            event.stopPropagation();

            if (gameOpen) {
                closeGame();
            }

        },
        {
            passive: false
        }
    );

    /*
        Click fallback.
    */

    newButton.addEventListener(
        "click",
        event => {

            event.preventDefault();
            event.stopPropagation();

            if (gameOpen) {
                closeGame();
            }

        }
    );

    gameOverlay.appendChild(
        newButton
    );

    exitButton =
        newButton;

    /*
        Force the new button to receive
        a completely fresh layout box.
    */

    void newButton.offsetWidth;

    void newButton.offsetHeight;

    void newButton.getBoundingClientRect();
}


/*
    FORCE TOUCH / LAYOUT RESYNC
*/

function forceTouchResync() {

    if (!gameOpen) {
        return;
    }

    /*
        Temporarily remove the overlay from
        hit testing.

        This makes WebKit discard the old
        hit-test relationship.
    */

    gameOverlay.style.pointerEvents =
        "none";

    /*
        Force a complete layout flush.
    */

    void document.documentElement.offsetHeight;

    void document.body.offsetHeight;

    void gameOverlay.offsetHeight;

    /*
        Recalculate the viewport using the
        dimensions iOS has now settled on.
    */

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;

    gameOverlay.style.width =
        width + "px";

    gameOverlay.style.height =
        height + "px";

    gameFrame.style.width =
        width + "px";

    gameFrame.style.height =
        height + "px";

    /*
        Force another layout flush.
    */

    void gameOverlay.getBoundingClientRect();

    void gameFrame.getBoundingClientRect();

    /*
        Destroy the old button and create
        a completely new touch target.
    */

    rebuildExitButton();

    /*
        Force the new button's geometry
        into WebKit's layout tree.
    */

    if (exitButton) {

        void exitButton.offsetWidth;

        void exitButton.offsetHeight;

        exitButton.getBoundingClientRect();

    }

    /*
        Restore hit testing.
    */

    gameOverlay.style.pointerEvents =
        "auto";

    /*
        Final layout flush.
    */

    void gameOverlay.offsetHeight;

    if (exitButton) {
        exitButton.getBoundingClientRect();
    }
}


/*
    Wait for iOS to completely finish
    adjusting the UI before resyncing.
*/

function scheduleButtonRebuild() {

    if (!gameOpen) {
        return;
    }

    clearTimeout(
        rebuildTimer
    );

    rebuildTimer =
        setTimeout(() => {

            if (!gameOpen) {
                return;
            }

            /*
                Wait for two animation frames
                so the final viewport geometry
                has actually been committed.
            */

            requestAnimationFrame(() => {

                requestAnimationFrame(() => {

                    if (!gameOpen) {
                        return;
                    }

                    forceTouchResync();

                });

            });

        }, 300);
}


/*
    Rotation events
*/

window.addEventListener(
    "orientationchange",
    scheduleButtonRebuild
);


/*
    iOS sends resize events during
    orientation changes.
*/

window.addEventListener(
    "resize",
    scheduleButtonRebuild
);


/*
    Track the visual viewport too.
*/

if (window.visualViewport) {

    window.visualViewport.addEventListener(
        "resize",
        scheduleButtonRebuild
    );

}


/*
    Open game
*/

function openGame(file) {

    /*
        Save exact scroll position.
    */

    savedScrollPosition =
        window.scrollY;

    /*
        Mark game as open.
    */

    gameOpen = true;

    /*
        Hide games.
    */

    gamesContainer.style.display =
        "none";

    /*
        Make page black.
    */

    document.body.classList.add(
        "playing"
    );

    /*
        Show game overlay.
    */

    gameOverlay.style.display =
        "block";

    /*
        Allow overlay hit testing.
    */

    gameOverlay.style.pointerEvents =
        "auto";

    /*
        Prevent page scrolling.
    */

    document.body.style.overflow =
        "hidden";

    /*
        Load game.
    */

    gameFrame.src =
        file;

    /*
        Set initial viewport.
    */

    updateGameViewport();

    /*
        Create a fresh Exit button.
    */

    rebuildExitButton();

}


/*
    Close game
*/

function closeGame() {

    if (!gameOpen) {
        return;
    }

    /*
        Mark closed first so any pending
        resize/rebuild cannot recreate
        the button.
    */

    gameOpen = false;

    /*
        Cancel pending rebuild.
    */

    clearTimeout(
        rebuildTimer
    );

    rebuildTimer = null;

    /*
        Stop game.
    */

    gameFrame.src = "";

    /*
        Disable overlay hit testing.
    */

    gameOverlay.style.pointerEvents =
        "none";

    /*
        Hide game.
    */

    gameOverlay.style.display =
        "none";

    /*
        Restore games.
    */

    gamesContainer.style.display =
        "";

    /*
        Restore normal background.
    */

    document.body.classList.remove(
        "playing"
    );

    /*
        Restore scrolling.
    */

    document.body.style.overflow =
        "";

    /*
        Restore exact scroll position.
    */

    requestAnimationFrame(() => {

        window.scrollTo(
            0,
            savedScrollPosition
        );

    });

}


/*
    Start.
*/

loadGames();

</script>

</body>
</html>
