<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover">

    <title>ZenPlay</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #08090d;
            color: white;
        }

        body {
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            font-size: 3rem;
            margin: 0 0 10px;
        }

        .subtitle {
            color: #9da3b4;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(240px, 1fr)
            );
            gap: 20px;
        }

        .game {
            padding: 25px;
            border-radius: 18px;
            background: #11131a;
            border: 1px solid #242733;
            color: white;
            cursor: pointer;
            transition:
                transform 0.2s,
                border-color 0.2s;
        }

        .game:hover {
            transform: translateY(-4px);
            border-color: #4d556b;
        }

        .game h2 {
            margin: 0 0 10px;
        }

        .game p {
            margin: 0 0 15px;
            color: #9da3b4;
            line-height: 1.5;
        }

        .game-info {
            font-size: 0.85rem;
            color: #6f7688;
        }

        /* Game overlay */

        #gameOverlay {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            background: #000;

            display: none;

            z-index: 1000;

            overflow: hidden;
        }

        #gameFrame {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            border: none;

            display: block;

            background: #000;

            z-index: 1001;
        }

        /* Exit button */

        #exitButton {
            position: fixed;

            top: calc(16px + env(safe-area-inset-top));
            right: calc(16px + env(safe-area-inset-right));

            z-index: 1003;

            padding: 10px 16px;

            border: none;
            border-radius: 10px;

            background: rgba(20, 20, 25, 0.85);
            color: white;

            font-size: 15px;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            pointer-events: auto;

            user-select: none;
            -webkit-user-select: none;
        }

        #exitButton:hover {
            background: rgba(40, 40, 48, 0.95);
        }

        /* Black page while playing */

        body.playing {
            background: #000;
            padding: 0;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>ZenPlay</h1>

    <p class="subtitle">
        Simple, satisfying games.
    </p>

    <div class="games" id="games">
        Loading games...
    </div>

</div>

<!-- Game overlay -->

<div id="gameOverlay">

    <button
        id="exitButton"
        type="button">
        Exit
    </button>

    <iframe
        id="gameFrame"
        allow="fullscreen">
    </iframe>

</div>

<script>

const gamesContainer =
    document.getElementById("games");

const gameOverlay =
    document.getElementById("gameOverlay");

const gameFrame =
    document.getElementById("gameFrame");

let exitButton =
    document.getElementById("exitButton");

let savedScrollPosition = 0;

let gameOpen = false;


/*
    Rebuild the Exit button.

    iOS Safari/WebKit can keep stale touch-hit
    geometry after a device rotation.

    Removing the old button and creating a
    completely new one forces WebKit to create
    a fresh hit-test region.
*/

function rebuildExitButton() {

    if (!gameOpen) {
        return;
    }

    const oldButton =
        document.getElementById("exitButton");

    if (oldButton) {
        oldButton.remove();
    }

    const newButton =
        document.createElement("button");

    newButton.id = "exitButton";

    newButton.type = "button";

    newButton.textContent = "Exit";


    /*
        Use pointerup for touch devices.
    */

    newButton.addEventListener(
        "pointerup",
        event => {

            event.preventDefault();
            event.stopPropagation();

            if (gameOpen) {
                closeGame();
            }

        },
        {
            passive: false
        }
    );


    /*
        Click fallback for desktop.
    */

    newButton.addEventListener(
        "click",
        event => {

            event.preventDefault();
            event.stopPropagation();

            if (gameOpen) {
                closeGame();
            }

        }
    );


    gameOverlay.appendChild(newButton);

    exitButton = newButton;


    /*
        Force WebKit to calculate the new
        element's layout immediately.
    */

    void newButton.offsetWidth;
    void newButton.offsetHeight;

}


/*
    Update the game viewport after rotation.
*/

function updateGameViewport() {

    if (!gameOpen) {
        return;
    }

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;


    gameOverlay.style.width =
        width + "px";

    gameOverlay.style.height =
        height + "px";


    gameFrame.style.width =
        width + "px";

    gameFrame.style.height =
        height + "px";


    /*
        Force a fresh layout calculation.
    */

    void gameOverlay.offsetWidth;
    void gameOverlay.offsetHeight;

    void gameFrame.offsetWidth;
    void gameFrame.offsetHeight;

}


/*
    Rebuild after rotation.

    Multiple passes are intentional because iOS
    can update its viewport geometry in stages.
*/

function rebuildAfterRotation() {

    if (!gameOpen) {
        return;
    }

    updateGameViewport();

    rebuildExitButton();


    requestAnimationFrame(() => {

        updateGameViewport();
        rebuildExitButton();

    });


    setTimeout(() => {

        updateGameViewport();
        rebuildExitButton();

    }, 50);


    setTimeout(() => {

        updateGameViewport();
        rebuildExitButton();

    }, 150);


    setTimeout(() => {

        updateGameViewport();
        rebuildExitButton();

    }, 300);


    setTimeout(() => {

        updateGameViewport();
        rebuildExitButton();

    }, 500);

}


/*
    Orientation changes.
*/

window.addEventListener(
    "orientationchange",
    rebuildAfterRotation
);


/*
    Resize also catches viewport changes
    that may not fire orientationchange.
*/

window.addEventListener(
    "resize",
    () => {

        if (!gameOpen) {
            return;
        }

        updateGameViewport();

    }
);


/*
    iOS visual viewport changes.
*/

if (window.visualViewport) {

    window.visualViewport.addEventListener(
        "resize",
        () => {

            if (!gameOpen) {
                return;
            }

            updateGameViewport();

        }
    );

}


async function loadGames() {

    try {

        const response =
            await fetch("games.json");

        if (!response.ok) {
            throw new Error(
                "Could not load games.json"
            );
        }

        const data =
            await response.json();

        gamesContainer.innerHTML = "";

        data.games.forEach(game => {

            const card =
                document.createElement("div");

            card.className = "game";

            card.onclick = () => {
                openGame(game.file);
            };

            card.innerHTML = `
                <h2>${game.name}</h2>

                <p>
                    ${game.description}
                </p>

                <div class="game-info">
                    ${game.category} · ${game.type}
                </div>
            `;

            gamesContainer.appendChild(card);

        });

    } catch (error) {

        gamesContainer.innerHTML =
            "Unable to load games.";

        console.error(error);

    }
}


function openGame(file) {

    /*
        Save the exact scroll position.
    */

    savedScrollPosition =
        window.scrollY;


    /*
        Mark the game as open BEFORE
        rebuilding the button.
    */

    gameOpen = true;


    /*
        Hide the games container.
    */

    gamesContainer.style.display =
        "none";


    /*
        Make the page black.
    */

    document.body.classList.add(
        "playing"
    );


    /*
        Show the game.
    */

    gameOverlay.style.display =
        "block";


    /*
        Prevent scrolling.
    */

    document.body.style.overflow =
        "hidden";


    /*
        Load the game.
    */

    gameFrame.src =
        file;


    /*
        Build a fresh Exit button.
    */

    rebuildExitButton();


    /*
        Make sure the viewport geometry
        is correct when opening.
    */

    updateGameViewport();

}


function closeGame() {

    /*
        Prevent duplicate close events.
    */

    if (!gameOpen) {
        return;
    }

    gameOpen = false;


    /*
        Stop the game.
    */

    gameFrame.src = "";


    /*
        Hide the game.
    */

    gameOverlay.style.display =
        "none";


    /*
        Restore the games container.
    */

    gamesContainer.style.display =
        "";


    /*
        Restore the normal background.
    */

    document.body.classList.remove(
        "playing"
    );


    /*
        Restore scrolling.
    */

    document.body.style.overflow =
        "";


    /*
        Restore the exact position
        the user was at before opening
        the game.
    */

    requestAnimationFrame(() => {

        window.scrollTo(
            0,
            savedScrollPosition
        );

    });

}


loadGames();

</script>

</body>
</html>
