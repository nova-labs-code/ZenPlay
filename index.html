<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <title>ZenPlay</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        body {
            overflow-x: hidden;
        }

        body.playing {
            background: #000;
            padding: 0;
            overflow: hidden;
        }

        #games {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            padding: 20px;
        }

        .game {
            background: #1d1d1d;
            border-radius: 14px;
            padding: 20px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .game h2 {
            margin: 0 0 8px;
        }

        .game p {
            margin: 0;
            color: #aaa;
        }

        /*
         * Full-screen game layer.
         */
        #gameOverlay {
            position: fixed;
            inset: 0;

            width: 100vw;
            width: 100dvw;

            height: 100vh;
            height: 100dvh;

            background: #000;
            display: none;

            overflow: hidden;
            z-index: 1000;

            isolation: isolate;
        }

        /*
         * Game iframe.
         */
        #gameFrame {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            border: none;
            display: block;

            background: #000;

            z-index: 1001;
        }

        /*
         * The button is dynamically rebuilt after orientation changes.
         */
        #exitButton {
            position: fixed;

            top: calc(16px + env(safe-area-inset-top));
            right: calc(16px + env(safe-area-inset-right));

            z-index: 1003;

            padding: 10px 16px;

            border: none;
            border-radius: 10px;

            background: rgba(20, 20, 25, 0.9);
            color: #fff;

            font-size: 15px;
            font-family: Arial, sans-serif;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            pointer-events: auto;

            user-select: none;
            -webkit-user-select: none;
        }

        #exitButton:active {
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <div id="games"></div>

    <div id="gameOverlay">
        <iframe
            id="gameFrame"
            title="Game"
            allow="fullscreen; autoplay"
        ></iframe>
    </div>

    <script>
        const gamesContainer =
            document.getElementById("games");

        const gameOverlay =
            document.getElementById("gameOverlay");

        const gameFrame =
            document.getElementById("gameFrame");

        let savedScrollPosition = 0;
        let gameOpen = false;
        let currentGameFile = null;


        /*
         * Load games.
         */
        async function loadGames() {
            try {
                const response = await fetch("games.json", {
                    cache: "no-cache"
                });

                const games = await response.json();

                gamesContainer.innerHTML = "";

                games.forEach(game => {
                    const card = document.createElement("div");

                    card.className = "game";

                    card.innerHTML = `
                        <h2>${game.name}</h2>
                        <p>${game.description || ""}</p>
                    `;

                    card.addEventListener("click", () => {
                        openGame(game.file);
                    });

                    gamesContainer.appendChild(card);
                });

                /*
                 * Restore game after returning to the web app.
                 */
                if (
                    location.hash === "#game" &&
                    sessionStorage.getItem("zenplay-current-game")
                ) {
                    const file =
                        sessionStorage.getItem(
                            "zenplay-current-game"
                        );

                    const saved =
                        sessionStorage.getItem(
                            "zenplay-scroll-position"
                        );

                    if (saved !== null) {
                        savedScrollPosition =
                            Number(saved);
                    }

                    showGame(file);
                }

            } catch (error) {
                console.error(
                    "Failed to load games:",
                    error
                );
            }
        }


        /*
         * Open a game.
         */
        function openGame(file) {
            savedScrollPosition =
                window.scrollY;

            currentGameFile = file;

            sessionStorage.setItem(
                "zenplay-current-game",
                file
            );

            sessionStorage.setItem(
                "zenplay-scroll-position",
                String(savedScrollPosition)
            );

            history.pushState(
                {
                    zenplayGame: true
                },
                "",
                location.pathname +
                location.search +
                "#game"
            );

            showGame(file);
        }


        /*
         * Show the game.
         */
        function showGame(file) {
            currentGameFile = file;
            gameOpen = true;

            gamesContainer.style.display = "none";

            document.body.classList.add("playing");

            document.body.style.overflow = "hidden";

            gameOverlay.style.display = "block";

            /*
             * Set the iframe dimensions.
             */
            updateGameViewport();

            /*
             * Load the game.
             */
            gameFrame.src = file;

            /*
             * Build a completely fresh Exit button.
             */
            rebuildExitButton();
        }


        /*
         * Completely destroy and recreate the Exit button.
         *
         * This is intentional.
         *
         * iOS standalone Web Apps can retain stale hit-test
         * geometry after an orientation change. Removing the
         * element and inserting a new one forces WebKit to
         * create a fresh touch target.
         */
        function rebuildExitButton() {
            if (!gameOpen) {
                return;
            }

            const oldButton =
                document.getElementById("exitButton");

            if (oldButton) {
                oldButton.remove();
            }

            const newButton =
                document.createElement("button");

            newButton.id = "exitButton";

            newButton.type = "button";

            newButton.textContent = "Exit";

            /*
             * Pointer event.
             */
            newButton.addEventListener(
                "pointerup",
                event => {
                    event.preventDefault();

                    if (gameOpen) {
                        closeGame();
                    }
                },
                {
                    passive: false
                }
            );

            /*
             * Click fallback.
             */
            newButton.addEventListener(
                "click",
                event => {
                    event.preventDefault();

                    if (gameOpen) {
                        closeGame();
                    }
                }
            );

            /*
             * Add the new button directly to the game overlay.
             *
             * This places it above the iframe.
             */
            gameOverlay.appendChild(newButton);

            /*
             * Force layout calculation immediately.
             */
            void newButton.offsetTop;
            void newButton.offsetLeft;
            void newButton.offsetWidth;
            void newButton.offsetHeight;

            /*
             * Force another layout pass on iOS.
             */
            requestAnimationFrame(() => {
                if (!gameOpen) {
                    return;
                }

                void newButton.offsetWidth;
                void newButton.offsetHeight;
            });
        }


        /*
         * Update the game viewport.
         */
        function updateGameViewport() {
            if (!gameOpen) {
                return;
            }

            const width =
                window.innerWidth;

            const height =
                window.innerHeight;

            gameOverlay.style.width =
                width + "px";

            gameOverlay.style.height =
                height + "px";

            gameFrame.style.width =
                width + "px";

            gameFrame.style.height =
                height + "px";

            /*
             * Force layout.
             */
            void gameOverlay.offsetWidth;
            void gameOverlay.offsetHeight;

            void gameFrame.offsetWidth;
            void gameFrame.offsetHeight;
        }


        /*
         * Close the game.
         */
        function closeGame() {
            if (!gameOpen) {
                return;
            }

            finishCloseGame();

            /*
             * Return the URL to the normal page without
             * creating another history entry.
             */
            if (location.hash === "#game") {
                history.replaceState(
                    null,
                    "",
                    location.pathname +
                    location.search
                );
            }
        }


        /*
         * Finish closing the game.
         */
        function finishCloseGame() {
            gameOpen = false;
            currentGameFile = null;

            /*
             * Remove the dynamically-created button.
             */
            const exitButton =
                document.getElementById("exitButton");

            if (exitButton) {
                exitButton.remove();
            }

            /*
             * Stop the game.
             */
            gameFrame.src = "";

            /*
             * Hide game UI.
             */
            gameOverlay.style.display = "none";

            gamesContainer.style.display = "";

            document.body.classList.remove("playing");

            document.body.style.overflow = "";

            /*
             * Clear saved game state.
             */
            sessionStorage.removeItem(
                "zenplay-current-game"
            );

            sessionStorage.removeItem(
                "zenplay-scroll-position"
            );

            /*
             * Restore scroll position.
             */
            requestAnimationFrame(() => {
                window.scrollTo(
                    0,
                    savedScrollPosition
                );
            });
        }


        /*
         * Browser/system Back.
         */
        window.addEventListener(
            "popstate",
            () => {
                if (
                    gameOpen &&
                    location.hash !== "#game"
                ) {
                    finishCloseGame();
                }
            }
        );


        /*
         * Hash changes.
         */
        window.addEventListener(
            "hashchange",
            () => {
                if (
                    gameOpen &&
                    location.hash !== "#game"
                ) {
                    finishCloseGame();
                }
            }
        );


        /*
         * iOS pageshow handling.
         */
        window.addEventListener(
            "pageshow",
            () => {
                if (
                    location.hash === "#game" &&
                    sessionStorage.getItem(
                        "zenplay-current-game"
                    )
                ) {
                    const file =
                        sessionStorage.getItem(
                            "zenplay-current-game"
                        );

                    showGame(file);
                }
            }
        );


        /*
         * Normal viewport resize.
         *
         * Rebuild instead of simply moving the button.
         */
        window.addEventListener(
            "resize",
            () => {
                if (!gameOpen) {
                    return;
                }

                updateGameViewport();

                rebuildExitButton();

                setTimeout(() => {
                    if (gameOpen) {
                        updateGameViewport();
                        rebuildExitButton();
                    }
                }, 100);

                setTimeout(() => {
                    if (gameOpen) {
                        updateGameViewport();
                        rebuildExitButton();
                    }
                }, 300);
            }
        );


        /*
         * Orientation change.
         *
         * The important part:
         *
         * OLD BUTTON
         *     ↓
         * REMOVE
         *     ↓
         * NEW BUTTON
         *     ↓
         * NEW iOS HIT REGION
         */
        window.addEventListener(
            "orientationchange",
            () => {
                if (!gameOpen) {
                    return;
                }

                /*
                 * Immediately rebuild.
                 */
                updateGameViewport();
                rebuildExitButton();

                /*
                 * Rebuild again while iOS finishes
                 * changing the viewport.
                 */
                setTimeout(() => {
                    if (gameOpen) {
                        updateGameViewport();
                        rebuildExitButton();
                    }
                }, 50);

                setTimeout(() => {
                    if (gameOpen) {
                        updateGameViewport();
                        rebuildExitButton();
                    }
                }, 150);

                setTimeout(() => {
                    if (gameOpen) {
                        updateGameViewport();
                        rebuildExitButton();
                    }
                }, 300);

                setTimeout(() => {
                    if (gameOpen) {
                        updateGameViewport();
                        rebuildExitButton();
                    }
                }, 500);
            }
        );


        /*
         * visualViewport is especially useful on iOS because
         * its viewport can update separately from window.resize.
         */
        if (window.visualViewport) {
            window.visualViewport.addEventListener(
                "resize",
                () => {
                    if (!gameOpen) {
                        return;
                    }

                    updateGameViewport();
                    rebuildExitButton();
                }
            );
        }


        /*
         * Start.
         */
        loadGames();
    </script>

</body>
</html>
