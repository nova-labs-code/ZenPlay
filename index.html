<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover">

    <title>ZenPlay</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #08090d;
            color: white;
        }

        body {
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            font-size: 3rem;
            margin: 0 0 10px;
        }

        .subtitle {
            color: #9da3b4;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(240px, 1fr)
            );
            gap: 20px;
        }

        .game {
            padding: 25px;
            border-radius: 18px;
            background: #11131a;
            border: 1px solid #242733;
            color: white;
            cursor: pointer;
            transition:
                transform 0.2s,
                border-color 0.2s;
        }

        .game:hover {
            transform: translateY(-4px);
            border-color: #4d556b;
        }

        .game h2 {
            margin: 0 0 10px;
        }

        .game p {
            margin: 0 0 15px;
            color: #9da3b4;
            line-height: 1.5;
        }

        .game-info {
            font-size: 0.85rem;
            color: #6f7688;
        }

        /*
            Game overlay

            Absolute instead of fixed to avoid the iOS
            fixed-position touch-coordinate issue after rotation.
        */

        #gameOverlay {
            position: absolute;

            left: 0;
            top: 0;

            width: 100vw;
            height: 100vh;

            background: #000;

            display: none;

            z-index: 1000;

            overflow: hidden;

            touch-action: none;
        }

        /*
            Game iframe
        */

        #gameFrame {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            border: none;

            display: block;

            background: #000;

            z-index: 1001;

            touch-action: auto;
        }

        /*
            Exit button

            Absolute so it uses the overlay's coordinate
            system rather than a fixed viewport coordinate.
        */

        #exitButton {
            position: absolute;

            top: calc(
                16px + env(safe-area-inset-top)
            );

            right: calc(
                16px + env(safe-area-inset-right)
            );

            z-index: 1003;

            padding: 10px 16px;

            border: none;
            border-radius: 10px;

            background: rgba(20, 20, 25, 0.85);
            color: white;

            font-size: 15px;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;

            touch-action: manipulation;

            pointer-events: auto;

            user-select: none;
            -webkit-user-select: none;

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        #exitButton:hover {
            background: rgba(40, 40, 48, 0.95);
        }

        body.playing {
            background: #000;
            padding: 0;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>ZenPlay</h1>

    <p class="subtitle">
        Simple, satisfying games.
    </p>

    <div class="games" id="games">
        Loading games...
    </div>

</div>


<!-- Game overlay -->

<div id="gameOverlay">

    <button id="exitButton">
        Exit
    </button>

    <iframe
        id="gameFrame"
        allow="fullscreen">
    </iframe>

</div>


<script>

const gamesContainer =
    document.getElementById("games");

const gameOverlay =
    document.getElementById("gameOverlay");

const gameFrame =
    document.getElementById("gameFrame");

const exitButton =
    document.getElementById("exitButton");


let savedScrollPosition = 0;

let gameOpen = false;

let resizeTimer = null;

let exitHandled = false;


/*
    Load games
*/

async function loadGames() {

    try {

        const response =
            await fetch("games.json");

        if (!response.ok) {
            throw new Error(
                "Could not load games.json"
            );
        }

        const data =
            await response.json();

        gamesContainer.innerHTML = "";

        data.games.forEach(game => {

            const card =
                document.createElement("div");

            card.className = "game";

            card.onclick = () => {
                openGame(game.file);
            };

            card.innerHTML = `
                <h2>${game.name}</h2>

                <p>
                    ${game.description}
                </p>

                <div class="game-info">
                    ${game.category} · ${game.type}
                </div>
            `;

            gamesContainer.appendChild(card);

        });

    } catch (error) {

        gamesContainer.innerHTML =
            "Unable to load games.";

        console.error(error);

    }

}


/*
    Get the actual visible viewport size.

    visualViewport is preferred on iOS because the visual
    viewport can temporarily differ from window.innerWidth
    and window.innerHeight during rotation.
*/

function getViewportSize() {

    if (window.visualViewport) {

        return {
            width:
                Math.round(
                    window.visualViewport.width
                ),

            height:
                Math.round(
                    window.visualViewport.height
                )
        };

    }

    return {
        width:
            Math.round(
                window.innerWidth
            ),

        height:
            Math.round(
                window.innerHeight
            )
    };

}


/*
    Resize the overlay and iframe.

    This is the important iframe fix.
*/

function updateGameViewport() {

    if (!gameOpen) {
        return;
    }

    const viewport =
        getViewportSize();

    /*
        Keep the overlay at the document position
        occupied by the viewport.
    */

    gameOverlay.style.left = "0px";

    gameOverlay.style.top =
        savedScrollPosition + "px";

    gameOverlay.style.width =
        viewport.width + "px";

    gameOverlay.style.height =
        viewport.height + "px";


    /*
        Explicitly resize the iframe.

        Do NOT rely only on width:100% and height:100%.
        iOS can retain the old iframe layout size during
        an orientation transition.
    */

    gameFrame.style.left = "0px";

    gameFrame.style.top = "0px";

    gameFrame.style.width =
        viewport.width + "px";

    gameFrame.style.height =
        viewport.height + "px";


    /*
        Force layout calculation.
    */

    void gameOverlay.offsetWidth;

    void gameOverlay.offsetHeight;

    void gameFrame.offsetWidth;

    void gameFrame.offsetHeight;

    gameOverlay.getBoundingClientRect();

    gameFrame.getBoundingClientRect();

}


/*
    Rotation/resize synchronization.

    iOS can fire multiple resize events during rotation,
    so we wait until the viewport has settled.
*/

function scheduleViewportSync() {

    if (!gameOpen) {
        return;
    }

    clearTimeout(resizeTimer);

    /*
        Immediately stop using stale dimensions.
    */

    updateGameViewport();


    /*
        Wait for the current resize stage to finish.
    */

    resizeTimer = setTimeout(() => {

        requestAnimationFrame(() => {

            requestAnimationFrame(() => {

                updateGameViewport();

                /*
                    One more delayed pass handles the case
                    where iOS changes visualViewport after
                    the normal resize event.
                */

                setTimeout(() => {

                    updateGameViewport();

                }, 100);

            });

        });

    }, 150);

}


/*
    Open game
*/

function openGame(file) {

    /*
        Save exact scroll position.
    */

    savedScrollPosition =
        window.scrollY;

    gameOpen = true;


    /*
        Hide game cards.
    */

    gamesContainer.style.display =
        "none";


    /*
        Make page black.
    */

    document.body.classList.add(
        "playing"
    );


    /*
        Prevent page scrolling.
    */

    document.body.style.overflow =
        "hidden";


    /*
        Show overlay.
    */

    gameOverlay.style.display =
        "block";


    /*
        Load game.
    */

    gameFrame.src = file;


    /*
        Initial sizing.
    */

    updateGameViewport();

}


/*
    Close game
*/

function closeGame() {

    gameOpen = false;

    clearTimeout(resizeTimer);


    /*
        Stop iframe.
    */

    gameFrame.src = "";


    /*
        Hide overlay.
    */

    gameOverlay.style.display =
        "none";


    /*
        Restore game cards.
    */

    gamesContainer.style.display =
        "";


    /*
        Restore page.
    */

    document.body.classList.remove(
        "playing"
    );


    /*
        Restore scrolling.
    */

    document.body.style.overflow =
        "";


    /*
        Restore exact scroll position.
    */

    requestAnimationFrame(() => {

        window.scrollTo(
            0,
            savedScrollPosition
        );

    });

}


/*
    Exit button
*/

function handleExit(event) {

    event.preventDefault();

    event.stopPropagation();

    if (exitHandled) {
        return;
    }

    exitHandled = true;

    closeGame();

    setTimeout(() => {

        exitHandled = false;

    }, 350);

}


exitButton.addEventListener(
    "pointerup",
    handleExit,
    {
        passive: false
    }
);


exitButton.addEventListener(
    "touchend",
    handleExit,
    {
        passive: false
    }
);


exitButton.addEventListener(
    "click",
    handleExit
);


/*
    Normal browser resize
*/

window.addEventListener(
    "resize",
    () => {

        scheduleViewportSync();

    }
);


/*
    Orientation change
*/

window.addEventListener(
    "orientationchange",
    () => {

        scheduleViewportSync();

    }
);


/*
    iOS visual viewport resize
*/

if (window.visualViewport) {

    window.visualViewport.addEventListener(
        "resize",
        () => {

            scheduleViewportSync();

        }
    );

}


/*
    Also catch viewport scrolling/offset changes.

    This can happen when iOS changes its visual viewport
    during rotation or browser UI transitions.
*/

if (window.visualViewport) {

    window.visualViewport.addEventListener(
        "scroll",
        () => {

            if (!gameOpen) {
                return;
            }

            updateGameViewport();

        }
    );

}


/*
    Load games.
*/

loadGames();

</script>

</body>
</html>
