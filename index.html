<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover">

    <title>ZenPlay</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #08090d;
            color: white;
        }

        body {
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            font-size: 3rem;
            margin: 0 0 10px;
        }

        .subtitle {
            color: #9da3b4;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(240px, 1fr)
            );
            gap: 20px;
        }

        .game {
            padding: 25px;
            border-radius: 18px;
            background: #11131a;
            border: 1px solid #242733;
            color: white;
            cursor: pointer;
            transition:
                transform 0.2s,
                border-color 0.2s;
        }

        .game:hover {
            transform: translateY(-4px);
            border-color: #4d556b;
        }

        .game h2 {
            margin: 0 0 10px;
        }

        .game p {
            margin: 0 0 15px;
            color: #9da3b4;
            line-height: 1.5;
        }

        .game-info {
            font-size: 0.85rem;
            color: #6f7688;
        }

        /* =========================
           GAME OVERLAY
        ========================= */

        #gameOverlay {
            position: fixed;
            inset: 0;

            width: 100%;
            width: 100vw;
            width: 100dvw;

            height: 100%;
            height: 100vh;
            height: 100dvh;

            background: #000;

            display: none;

            z-index: 1000;

            overflow: hidden;

            isolation: isolate;
        }

        #gameFrame {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            border: none;

            display: block;

            background: #000;

            z-index: 1001;
        }

        /* =========================
           EXIT BUTTON
        ========================= */

        #exitButton {
            position: fixed;

            top: max(
                16px,
                env(safe-area-inset-top)
            );

            right: max(
                16px,
                env(safe-area-inset-right)
            );

            z-index: 1002;

            padding: 10px 16px;

            border: none;
            border-radius: 10px;

            background: rgba(20, 20, 25, 0.85);
            color: white;

            font-size: 15px;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        #exitButton:hover {
            background: rgba(40, 40, 48, 0.95);
        }

        #exitButton:active {
            transform: scale(0.96);
        }

        /* =========================
           PLAYING STATE
        ========================= */

        body.playing {
            background: #000;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>ZenPlay</h1>

    <p class="subtitle">
        Simple, satisfying games.
    </p>

    <div class="games" id="games">
        Loading games...
    </div>

</div>


<!-- GAME OVERLAY -->

<div id="gameOverlay">

    <button id="exitButton">
        Exit
    </button>

    <iframe
        id="gameFrame"
        allow="fullscreen">
    </iframe>

</div>


<script>

const gamesContainer =
    document.getElementById("games");

const gameOverlay =
    document.getElementById("gameOverlay");

const gameFrame =
    document.getElementById("gameFrame");

const exitButton =
    document.getElementById("exitButton");


let savedScrollPosition = 0;
let gameOpen = false;
let currentGameFile = null;


/* =========================
   HISTORY STATE
========================= */

/*
    Create a stable home history state.

    This gives the page a known state that
    we can return to after opening a game.
*/

if (!history.state ||
    !history.state.zenplayHome) {

    history.replaceState(
        {
            zenplayHome: true
        },
        "",
        location.href
    );
}


/* =========================
   LOAD GAMES
========================= */

async function loadGames() {

    try {

        const response =
            await fetch("games.json");

        if (!response.ok) {
            throw new Error(
                "Could not load games.json"
            );
        }

        const data =
            await response.json();

        gamesContainer.innerHTML = "";

        data.games.forEach(game => {

            const card =
                document.createElement("div");

            card.className = "game";

            card.onclick = () => {
                openGame(game.file);
            };

            card.innerHTML = `
                <h2>${game.name}</h2>

                <p>
                    ${game.description}
                </p>

                <div class="game-info">
                    ${game.category} · ${game.type}
                </div>
            `;

            gamesContainer.appendChild(card);

        });

        /*
            If the browser restored the page
            while a game was open, restore it.
        */

        restoreGameIfNeeded();

    } catch (error) {

        gamesContainer.innerHTML =
            "Unable to load games.";

        console.error(error);

    }
}


/* =========================
   OPEN GAME
========================= */

function openGame(file) {

    if (gameOpen) {
        return;
    }

    savedScrollPosition =
        window.scrollY;

    currentGameFile = file;

    sessionStorage.setItem(
        "zenplay-current-game",
        file
    );

    sessionStorage.setItem(
        "zenplay-scroll-position",
        String(savedScrollPosition)
    );

    /*
        Add exactly one game history entry.
    */

    history.pushState(
        {
            zenplayGame: true,
            gameFile: file
        },
        "",
        "#game"
    );

    showGame(file);
}


/* =========================
   SHOW GAME
========================= */

function showGame(file) {

    gameOpen = true;
    currentGameFile = file;

    gamesContainer.style.display =
        "none";

    document.body.classList.add(
        "playing"
    );

    gameOverlay.style.display =
        "block";

    document.body.style.overflow =
        "hidden";

    /*
        Force the overlay to recalculate
        its dimensions after rotation.
    */

    updateGameViewport();

    const gameURL =
        new URL(
            file,
            window.location.href
        ).href;

    if (gameFrame.src !== gameURL) {
        gameFrame.src = file;
    }
}


/* =========================
   CLOSE FROM EXIT BUTTON
========================= */

function closeGame() {

    if (!gameOpen) {
        return;
    }

    /*
        IMPORTANT:

        Do NOT use history.back() here.

        The Exit button directly closes
        the game. This prevents mobile
        orientation restoration from
        breaking the button.
    */

    finishCloseGame();

    /*
        Remove the game history entry
        without relying on popstate.
    */

    if (
        history.state &&
        history.state.zenplayGame
    ) {

        history.replaceState(
            {
                zenplayHome: true
            },
            "",
            location.pathname +
            location.search
        );

    } else if (
        location.hash === "#game"
    ) {

        history.replaceState(
            {
                zenplayHome: true
            },
            "",
            location.pathname +
            location.search
        );

    }

}


/* =========================
   ACTUALLY CLOSE GAME
========================= */

function finishCloseGame() {

    if (!gameOpen) {
        return;
    }

    gameOpen = false;

    currentGameFile = null;

    /*
        Completely stop the iframe.
    */

    gameFrame.src = "";

    /*
        Hide overlay.
    */

    gameOverlay.style.display =
        "none";

    /*
        Show game list.
    */

    gamesContainer.style.display =
        "";

    /*
        Restore normal page.
    */

    document.body.classList.remove(
        "playing"
    );

    document.body.style.overflow =
        "";

    /*
        Remove saved game state.
    */

    sessionStorage.removeItem(
        "zenplay-current-game"
    );

    sessionStorage.removeItem(
        "zenplay-scroll-position"
    );

    /*
        Restore exact scroll position.
    */

    requestAnimationFrame(() => {

        window.scrollTo(
            0,
            savedScrollPosition
        );

    });

}


/* =========================
   PHONE BACK BUTTON
========================= */

window.addEventListener(
    "popstate",
    event => {

        /*
            If the game is open and the
            browser moves back to the home
            history state, close it.
        */

        if (
            gameOpen &&
            (
                !event.state ||
                !event.state.zenplayGame
            )
        ) {

            finishCloseGame();

        }

    }
);


/* =========================
   HASH CHANGE
========================= */

window.addEventListener(
    "hashchange",
    () => {

        /*
            Handle mobile browsers that
            report the URL change separately
            from popstate.
        */

        if (
            gameOpen &&
            location.hash !== "#game"
        ) {

            finishCloseGame();

        }

    }
);


/* =========================
   RESTORE GAME
========================= */

function restoreGameIfNeeded() {

    if (
        location.hash !== "#game" ||
        gameOpen
    ) {
        return;
    }

    const savedGame =
        sessionStorage.getItem(
            "zenplay-current-game"
        );

    const savedScroll =
        sessionStorage.getItem(
            "zenplay-scroll-position"
        );

    if (!savedGame) {

        history.replaceState(
            {
                zenplayHome: true
            },
            "",
            location.pathname +
            location.search
        );

        return;
    }

    savedScrollPosition =
        savedScroll
            ? Number(savedScroll)
            : 0;

    /*
        Restore the game after the browser
        has finished restoring the document.
    */

    requestAnimationFrame(() => {

        showGame(savedGame);

    });

}


/* =========================
   PAGE SHOW
========================= */

window.addEventListener(
    "pageshow",
    () => {

        restoreGameIfNeeded();

        updateGameViewport();

    }
);


/* =========================
   ROTATION
========================= */

function updateGameViewport() {

    if (!gameOpen) {
        return;
    }

    /*
        Recalculate the overlay and iframe
        dimensions after orientation changes.
    */

    const viewportWidth =
        window.innerWidth;

    const viewportHeight =
        window.innerHeight;

    gameOverlay.style.width =
        viewportWidth + "px";

    gameOverlay.style.height =
        viewportHeight + "px";

    gameFrame.style.width =
        viewportWidth + "px";

    gameFrame.style.height =
        viewportHeight + "px";
}


/*
    Resize catches orientation changes
    on most browsers.
*/

window.addEventListener(
    "resize",
    () => {

        requestAnimationFrame(() => {
            updateGameViewport();
        });

    }
);


/*
    orientationchange is still useful on
    mobile browsers that delay resize.
*/

window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(() => {
            updateGameViewport();
        }, 50);

        setTimeout(() => {
            updateGameViewport();
        }, 300);

    }
);


/* =========================
   EXIT BUTTON
========================= */

exitButton.addEventListener(
    "click",
    closeGame
);


/* =========================
   LOAD
========================= */

loadGames();

</script>

</body>
</html>
