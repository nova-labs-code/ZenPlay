<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="ZenPlay"
    >

    <meta
        name="theme-color"
        content="#08090d"
    >

    <title>ZenPlay</title>

    <style>

        * {
            box-sizing: border-box;
        }


        /*
         * ========================================================
         * DOCUMENT
         * ========================================================
         */

        html {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #08090d;

            overflow-x: hidden;
        }

        body {
            margin: 0;
            padding: 40px 20px;

            width: 100%;
            min-height: 100%;

            font-family: Arial, sans-serif;

            background: #08090d;
            color: white;

            overflow-x: hidden;
        }


        /*
         * ========================================================
         * HOME
         * ========================================================
         */

        .container {
            width: 100%;
            max-width: 900px;

            margin: auto;
        }

        h1 {
            font-size: 3rem;
            margin: 0 0 10px;
        }

        .subtitle {
            color: #9da3b4;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .games {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(240px, 1fr)
                );

            gap: 20px;
        }

        .game {
            padding: 25px;

            border-radius: 18px;

            background: #11131a;

            border: 1px solid #242733;

            color: white;

            cursor: pointer;

            transition:
                transform 0.2s,
                border-color 0.2s;
        }

        .game:hover {
            transform: translateY(-4px);
            border-color: #4d556b;
        }

        .game h2 {
            margin: 0 0 10px;
        }

        .game p {
            margin: 0 0 15px;

            color: #9da3b4;

            line-height: 1.5;
        }

        .game-info {
            font-size: 0.85rem;
            color: #6f7688;
        }


        /*
         * ========================================================
         * PLAYING STATE
         * ========================================================
         */

        body.playing {
            padding: 0;
            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;
        }

        body.playing .container {
            display: none;
        }


        /*
         * ========================================================
         * GAME OVERLAY
         * ========================================================
         *
         * Absolute positioning is intentional.
         * This avoids the iOS fixed-position touch issue after
         * rotating between portrait and landscape.
         */

        #gameOverlay {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100vh;

            margin: 0;
            padding: 0;

            background: #000;

            display: none;

            overflow: hidden;

            z-index: 1000;

            touch-action: none;
        }


        /*
         * ========================================================
         * GAME IFRAME
         * ========================================================
         */

        #gameFrame {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            border: 0;

            display: block;

            background: #000;

            z-index: 1;

            max-width: 100%;
            max-height: 100%;
        }


        /*
         * ========================================================
         * GAME CONTROLS
         * ========================================================
         */

        #gameControls {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100vh;

            margin: 0;
            padding: 0;

            display: none;

            overflow: hidden;

            z-index: 2000;

            pointer-events: none;
        }


        /*
         * ========================================================
         * EXIT BUTTON
         * ========================================================
         *
         * Absolute positioning is intentional.
         */

        #exitButton {
            position: absolute;

            top:
                calc(
                    16px +
                    env(safe-area-inset-top)
                );

            right:
                max(
                    16px,
                    env(safe-area-inset-right)
                );

            max-width:
                calc(
                    100% -
                    32px -
                    env(safe-area-inset-right)
                );

            padding: 10px 16px;

            border: none;

            border-radius: 10px;

            background:
                rgba(
                    20,
                    20,
                    25,
                    0.85
                );

            color: white;

            font-size: 15px;

            cursor: pointer;

            pointer-events: auto;

            touch-action: manipulation;

            z-index: 2001;

            -webkit-backdrop-filter:
                blur(10px);

            backdrop-filter:
                blur(10px);
        }

        #exitButton:hover {
            background:
                rgba(
                    40,
                    40,
                    48,
                    0.95
                );
        }


        /*
         * ========================================================
         * STANDALONE HOME SCREEN WEB APP
         * ========================================================
         */

        @media all and (display-mode: standalone) {

            html {
                width: 100%;
                height: 100%;

                overflow: hidden;
            }

            body {
                width: 100%;
                min-height: 100%;

                overflow-x: hidden;
            }

            #gameOverlay,
            #gameControls {
                height: 100vh;
            }
        }

    </style>
</head>

<body>


    <!-- ========================================================
         HOME SCREEN
         ========================================================= -->

    <div class="container">

        <h1>
            ZenPlay
        </h1>

        <p class="subtitle">
            Simple, satisfying games.
        </p>

        <div
            class="games"
            id="games"
        >
            Loading games...
        </div>

    </div>


    <!-- ========================================================
         GAME
         ========================================================= -->

    <div id="gameOverlay">

        <iframe
            id="gameFrame"
            allow="fullscreen"
            scrolling="no">
        </iframe>

    </div>


    <!-- ========================================================
         GAME UI
         ========================================================= -->

    <div id="gameControls">

        <button
            id="exitButton"
            type="button"
            aria-label="Exit game"
            onclick="closeGame()">

            Exit

        </button>

    </div>


    <script>

        /*
         * ========================================================
         * ELEMENTS
         * ========================================================
         */

        const gamesContainer =
            document.getElementById(
                "games"
            );

        const gameOverlay =
            document.getElementById(
                "gameOverlay"
            );

        const gameControls =
            document.getElementById(
                "gameControls"
            );

        const gameFrame =
            document.getElementById(
                "gameFrame"
            );

        const exitButton =
            document.getElementById(
                "exitButton"
            );


        /*
         * ========================================================
         * STATE
         * ========================================================
         */

        let gameOpen = false;

        let resizeTimer = null;

        let rotationTimer = null;


        /*
         * ========================================================
         * LOAD GAMES
         * ========================================================
         */

        async function loadGames() {

            try {

                const response =
                    await fetch(
                        "games.json"
                    );

                if (!response.ok) {

                    throw new Error(
                        "Could not load games.json"
                    );

                }

                const data =
                    await response.json();

                gamesContainer.innerHTML =
                    "";


                data.games.forEach(
                    game => {

                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "game";


                        card.onclick =
                            () => {

                                openGame(
                                    game.file
                                );

                            };


                        card.innerHTML = `
                            <h2>
                                ${game.name}
                            </h2>

                            <p>
                                ${game.description}
                            </p>

                            <div class="game-info">
                                ${game.category}
                                ·
                                ${game.type}
                            </div>
                        `;


                        gamesContainer.appendChild(
                            card
                        );

                    }
                );


            } catch (error) {

                gamesContainer.innerHTML =
                    "Unable to load games.";

                console.error(error);

            }

        }


        /*
         * ========================================================
         * GET LAYOUT VIEWPORT
         * ========================================================
         *
         * Deliberately does not use visualViewport.
         */

        function getViewportSize() {

            const root =
                document.documentElement;


            return {

                width:
                    Math.max(
                        1,
                        root.clientWidth ||
                        window.innerWidth
                    ),

                height:
                    Math.max(
                        1,
                        root.clientHeight ||
                        window.innerHeight
                    )

            };

        }


        /*
         * ========================================================
         * UPDATE GAME VIEWPORT
         * ========================================================
         */

        function updateGameViewport() {

            if (!gameOpen) {
                return;
            }


            const viewport =
                getViewportSize();


            const width =
                Math.round(
                    viewport.width
                );

            const height =
                Math.round(
                    viewport.height
                );


            /*
             * Game overlay.
             */

            gameOverlay.style.left =
                "0px";

            gameOverlay.style.top =
                "0px";

            gameOverlay.style.width =
                width + "px";

            gameOverlay.style.height =
                height + "px";


            /*
             * Game iframe.
             */

            gameFrame.style.left =
                "0px";

            gameFrame.style.top =
                "0px";

            gameFrame.style.width =
                width + "px";

            gameFrame.style.height =
                height + "px";


            /*
             * Controls.
             */

            gameControls.style.left =
                "0px";

            gameControls.style.top =
                "0px";

            gameControls.style.width =
                width + "px";

            gameControls.style.height =
                height + "px";


            /*
             * Force WebKit to recalculate
             * the layout geometry.
             */

            void gameOverlay.offsetWidth;

            void gameFrame.offsetWidth;

            void gameControls.offsetWidth;

        }


        /*
         * ========================================================
         * FORCE LAYOUT
         * ========================================================
         */

        function forceLayout() {

            void document.documentElement.offsetHeight;

            void gameOverlay.offsetHeight;

            void gameFrame.offsetHeight;

            void gameControls.offsetHeight;

            void exitButton.offsetHeight;

        }


        /*
         * ========================================================
         * ROTATION
         * ========================================================
         */

        function resyncAfterRotation() {

            if (!gameOpen) {
                return;
            }


            clearTimeout(
                rotationTimer
            );


            /*
             * Hide the iframe while iOS finishes
             * changing its viewport.
             */

            gameFrame.style.visibility =
                "hidden";


            requestAnimationFrame(
                () => {

                    forceLayout();

                    updateGameViewport();


                    requestAnimationFrame(
                        () => {

                            forceLayout();

                            updateGameViewport();


                            requestAnimationFrame(
                                () => {

                                    forceLayout();

                                    updateGameViewport();


                                    rotationTimer =
                                        setTimeout(
                                            () => {

                                                requestAnimationFrame(
                                                    () => {

                                                        forceLayout();

                                                        updateGameViewport();

                                                        gameFrame.style.visibility =
                                                            "visible";

                                                    }
                                                );

                                            },
                                            250
                                        );

                                }
                            );

                        }
                    );

                }
            );

        }


        /*
         * ========================================================
         * NORMAL RESIZE
         * ========================================================
         */

        function scheduleResize() {

            if (!gameOpen) {
                return;
            }


            clearTimeout(
                resizeTimer
            );


            updateGameViewport();


            resizeTimer =
                setTimeout(
                    () => {

                        requestAnimationFrame(
                            () => {

                                forceLayout();

                                updateGameViewport();

                            }
                        );

                    },
                    100
                );

        }


        /*
         * ========================================================
         * OPEN GAME
         * ========================================================
         */

        function openGame(file) {

            if (gameOpen) {
                return;
            }


            gameOpen = true;


            /*
             * Freeze the Home Screen.
             */

            document.documentElement.style.overflow =
                "hidden";

            document.body.style.overflow =
                "hidden";

            document.body.classList.add(
                "playing"
            );


            /*
             * Show game layers.
             */

            gameOverlay.style.display =
                "block";

            gameControls.style.display =
                "block";


            /*
             * Hide iframe while its first
             * viewport is established.
             */

            gameFrame.style.visibility =
                "hidden";


            /*
             * Reset stale dimensions.
             */

            gameFrame.style.width =
                "0px";

            gameFrame.style.height =
                "0px";


            /*
             * Load game.
             */

            gameFrame.src =
                file;


            /*
             * Establish the viewport.
             */

            requestAnimationFrame(
                () => {

                    forceLayout();

                    updateGameViewport();


                    requestAnimationFrame(
                        () => {

                            forceLayout();

                            updateGameViewport();

                            gameFrame.style.visibility =
                                "visible";

                        }
                    );

                }
            );

        }


        /*
         * ========================================================
         * CLOSE GAME
         * ========================================================
         */

        function closeGame() {

            if (!gameOpen) {
                return;
            }


            gameOpen = false;


            clearTimeout(
                resizeTimer
            );

            clearTimeout(
                rotationTimer
            );


            /*
             * Stop the game.
             */

            gameFrame.src =
                "about:blank";

            gameFrame.style.visibility =
                "hidden";


            /*
             * Hide game layers.
             */

            gameOverlay.style.display =
                "none";

            gameControls.style.display =
                "none";


            /*
             * Restore Home Screen.
             */

            document.body.classList.remove(
                "playing"
            );

            document.body.style.overflow =
                "";

            document.documentElement.style.overflow =
                "";


            /*
             * Reset iframe dimensions.
             */

            gameFrame.style.width =
                "";

            gameFrame.style.height =
                "";

            gameFrame.style.visibility =
                "";

        }


        /*
         * ========================================================
         * ROTATION EVENTS
         * ========================================================
         */

        window.addEventListener(
            "orientationchange",
            () => {

                resyncAfterRotation();

            },
            {
                passive: true
            }
        );


        /*
         * ========================================================
         * RESIZE EVENTS
         * ========================================================
         */

        window.addEventListener(
            "resize",
            () => {

                scheduleResize();

            },
            {
                passive: true
            }
        );


        /*
         * ========================================================
         * LOAD
         * ========================================================
         */

        loadGames();

    </script>

</body>
</html>
