<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1.0,
            maximum-scale=1.0,
            user-scalable=no,
            viewport-fit=cover
        "
    >

    <title>ZenPlay</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #08090d;
            color: white;
        }

        body {
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            font-size: 3rem;
            margin: 0 0 10px;
        }

        .subtitle {
            color: #9da3b4;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(240px, 1fr)
            );
            gap: 20px;
        }

        .game {
            padding: 25px;
            border-radius: 18px;
            background: #11131a;
            border: 1px solid #242733;
            color: white;
            cursor: pointer;
            transition:
                transform 0.2s,
                border-color 0.2s;
        }

        .game:hover {
            transform: translateY(-4px);
            border-color: #4d556b;
        }

        .game h2 {
            margin: 0 0 10px;
        }

        .game p {
            margin: 0 0 15px;
            color: #9da3b4;
            line-height: 1.5;
        }

        .game-info {
            font-size: 0.85rem;
            color: #6f7688;
        }

        /*
            Game overlay

            Absolute positioning is intentional here.
            It avoids relying on iOS's fixed-position
            touch-coordinate handling during rotation.
        */

        #gameOverlay {
            position: absolute;

            left: 0;
            top: 0;

            width: 100vw;
            height: 100vh;

            background: #000;

            display: none;

            z-index: 1000;

            overflow: hidden;

            margin: 0;
            padding: 0;
        }

        /*
            The iframe fills the overlay.

            It does NOT use fixed positioning.
        */

        #gameFrame {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            border: none;

            display: block;

            background: #000;

            z-index: 1001;

            margin: 0;
            padding: 0;
        }

        /*
            Exit button
        */

        #exitButton {
            position: absolute;

            top: calc(
                16px + env(safe-area-inset-top)
            );

            right: calc(
                16px + env(safe-area-inset-right)
            );

            z-index: 1002;

            padding: 10px 16px;

            border: none;
            border-radius: 10px;

            background: rgba(20, 20, 25, 0.85);
            color: white;

            font-size: 15px;

            cursor: pointer;

            touch-action: manipulation;

            -webkit-tap-highlight-color: transparent;

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        #exitButton:hover {
            background: rgba(40, 40, 48, 0.95);
        }

        /*
            Black page while playing
        */

        body.playing {
            background: #000;
            padding: 0;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>ZenPlay</h1>

    <p class="subtitle">
        Simple, satisfying games.
    </p>

    <div class="games" id="games">
        Loading games...
    </div>

</div>


<!-- Game overlay -->

<div id="gameOverlay">

    <button
        id="exitButton"
        type="button"
    >
        Exit
    </button>

    <iframe
        id="gameFrame"
        allow="fullscreen"
    ></iframe>

</div>


<script>

const gamesContainer =
    document.getElementById("games");

const gameOverlay =
    document.getElementById("gameOverlay");

const gameFrame =
    document.getElementById("gameFrame");

const exitButton =
    document.getElementById("exitButton");

let savedScrollPosition = 0;

let viewportSyncTimer = null;


/*
    Get the current usable document viewport.

    documentElement.clientWidth/clientHeight are
    deliberately used instead of depending only on
    visualViewport because iOS can temporarily report
    stale visualViewport values during rotation.
*/

function getViewportSize() {

    const width =
        document.documentElement.clientWidth ||
        window.innerWidth;

    const height =
        document.documentElement.clientHeight ||
        window.innerHeight;

    return {
        width,
        height
    };
}


/*
    Update the overlay and iframe.

    The iframe itself stays 100% of the overlay.
    This means we only have to get the outer viewport
    dimensions correct.
*/

function updateGameViewport() {

    if (
        gameOverlay.style.display === "none" ||
        !document.body.classList.contains("playing")
    ) {
        return;
    }

    const viewport =
        getViewportSize();

    /*
        Keep the overlay at the exact scroll position
        where the game was opened.
    */

    gameOverlay.style.left = "0px";

    gameOverlay.style.top =
        savedScrollPosition + "px";

    gameOverlay.style.width =
        viewport.width + "px";

    gameOverlay.style.height =
        viewport.height + "px";


    /*
        Explicitly resize the iframe too.

        This makes the iframe update even if iOS does
        not immediately recalculate its percentage size.
    */

    gameFrame.style.left = "0px";

    gameFrame.style.top = "0px";

    gameFrame.style.width =
        viewport.width + "px";

    gameFrame.style.height =
        viewport.height + "px";
}


/*
    Force the browser to perform a layout before
    measuring the viewport again.
*/

function forceLayout() {

    void document.documentElement.offsetHeight;

    void gameOverlay.offsetWidth;

    void gameFrame.offsetWidth;
}


/*
    iOS can fire resize/orientation events while the
    rotation animation is still changing the viewport.

    So we wait until the UI has settled and then sync
    several times.
*/

function scheduleViewportSync() {

    if (
        !document.body.classList.contains("playing")
    ) {
        return;
    }

    clearTimeout(viewportSyncTimer);


    /*
        First sync after the current rendering cycle.
    */

    requestAnimationFrame(() => {

        forceLayout();

        updateGameViewport();


        /*
            Second sync on the next frame.
        */

        requestAnimationFrame(() => {

            forceLayout();

            updateGameViewport();


            /*
                Wait for iOS's rotation/layout process
                to settle.
            */

            viewportSyncTimer =
                setTimeout(() => {

                    requestAnimationFrame(() => {

                        forceLayout();

                        updateGameViewport();


                        /*
                            One final delayed sync.
                        */

                        viewportSyncTimer =
                            setTimeout(() => {

                                forceLayout();

                                updateGameViewport();

                            }, 150);

                    });

                }, 150);

        });

    });
}


/*
    Load games from games.json
*/

async function loadGames() {

    try {

        const response =
            await fetch("games.json");

        if (!response.ok) {

            throw new Error(
                "Could not load games.json"
            );

        }

        const data =
            await response.json();

        gamesContainer.innerHTML = "";


        data.games.forEach(game => {

            const card =
                document.createElement("div");

            card.className = "game";


            card.onclick = () => {

                openGame(game.file);

            };


            card.innerHTML = `
                <h2>${game.name}</h2>

                <p>
                    ${game.description}
                </p>

                <div class="game-info">
                    ${game.category} · ${game.type}
                </div>
            `;


            gamesContainer.appendChild(card);

        });

    } catch (error) {

        gamesContainer.innerHTML =
            "Unable to load games.";

        console.error(error);

    }

}


/*
    Open a game
*/

function openGame(file) {

    /*
        Save the exact page position.
    */

    savedScrollPosition =
        window.scrollY;


    /*
        Hide the game list.
    */

    gamesContainer.style.display =
        "none";


    /*
        Make the page black.
    */

    document.body.classList.add(
        "playing"
    );


    /*
        Prevent the document from scrolling.
    */

    document.body.style.overflow =
        "hidden";


    /*
        Show the game overlay.
    */

    gameOverlay.style.display =
        "block";


    /*
        Load the game.
    */

    gameFrame.src =
        file;


    /*
        Give the DOM one frame to create the
        overlay before measuring it.
    */

    requestAnimationFrame(() => {

        updateGameViewport();

        scheduleViewportSync();

    });

}


/*
    Close the game
*/

function closeGame() {

    /*
        Stop the game.
    */

    gameFrame.src = "";


    /*
        Hide the overlay.
    */

    gameOverlay.style.display =
        "none";


    /*
        Show the games again.
    */

    gamesContainer.style.display =
        "";


    /*
        Restore the normal page.
    */

    document.body.classList.remove(
        "playing"
    );


    /*
        Restore scrolling.
    */

    document.body.style.overflow =
        "";


    /*
        Clear any pending rotation sync.
    */

    clearTimeout(viewportSyncTimer);


    /*
        Restore the exact position where
        the game was opened.
    */

    requestAnimationFrame(() => {

        window.scrollTo(
            0,
            savedScrollPosition
        );

    });

}


/*
    Exit button events.

    pointerup is used first because it gives iOS
    a direct pointer interaction.

    click remains as a fallback.
*/

exitButton.addEventListener(
    "pointerup",
    event => {

        event.preventDefault();

        closeGame();

    },
    {
        passive: false
    }
);


exitButton.addEventListener(
    "click",
    event => {

        event.preventDefault();

        closeGame();

    }
);


/*
    Rotation / viewport events
*/

window.addEventListener(
    "orientationchange",
    () => {

        scheduleViewportSync();

    }
);


window.addEventListener(
    "resize",
    () => {

        scheduleViewportSync();

    }
);


/*
    visualViewport can change separately from the
    normal window viewport on iOS.
*/

if (window.visualViewport) {

    window.visualViewport.addEventListener(
        "resize",
        () => {

            scheduleViewportSync();

        }
    );

}


/*
    Initial game loading
*/

loadGames();

</script>

</body>
</html>
