<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover">

    <title>ZenPlay</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #08090d;
            color: white;
        }

        body {
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            font-size: 3rem;
            margin: 0 0 10px;
        }

        .subtitle {
            color: #9da3b4;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(240px, 1fr)
            );
            gap: 20px;
        }

        .game {
            padding: 25px;
            border-radius: 18px;
            background: #11131a;
            border: 1px solid #242733;
            color: white;
            cursor: pointer;
            transition:
                transform 0.2s,
                border-color 0.2s;
        }

        .game:hover {
            transform: translateY(-4px);
            border-color: #4d556b;
        }

        .game h2 {
            margin: 0 0 10px;
        }

        .game p {
            margin: 0 0 15px;
            color: #9da3b4;
            line-height: 1.5;
        }

        .game-info {
            font-size: 0.85rem;
            color: #6f7688;
        }

        /* Game overlay */

        #gameOverlay {
            position: fixed;
            inset: 0;

            width: 100vw;
            width: 100dvw;

            height: 100vh;
            height: 100dvh;

            background: #000;

            display: none;

            z-index: 1000;

            overflow: hidden;
        }

        #gameFrame {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            border: none;

            display: block;

            background: #000;

            z-index: 1001;
        }

        /* Exit button */

        #exitButton {
            position: fixed;

            top: 16px;
            right: 16px;

            z-index: 1002;

            padding: 10px 16px;

            border: none;
            border-radius: 10px;

            background: rgba(20, 20, 25, 0.85);
            color: white;

            font-size: 15px;

            cursor: pointer;

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        #exitButton:hover {
            background: rgba(40, 40, 48, 0.95);
        }

        /* Black page while playing */

        body.playing {
            background: #000;
            padding: 0;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>ZenPlay</h1>

    <p class="subtitle">
        Simple, satisfying games.
    </p>

    <div class="games" id="games">
        Loading games...
    </div>

</div>


<!-- Game overlay -->

<div id="gameOverlay">

    <button id="exitButton" onclick="closeGame()">
        Exit
    </button>

    <iframe
        id="gameFrame"
        allow="fullscreen">
    </iframe>

</div>


<script>

const gamesContainer =
    document.getElementById("games");

const gameOverlay =
    document.getElementById("gameOverlay");

const gameFrame =
    document.getElementById("gameFrame");


let savedScrollPosition = 0;
let gameOpen = false;
let currentGameFile = null;


/* =========================
   LOAD GAMES
========================= */

async function loadGames() {

    try {

        const response =
            await fetch("games.json");

        if (!response.ok) {
            throw new Error(
                "Could not load games.json"
            );
        }

        const data =
            await response.json();

        gamesContainer.innerHTML = "";

        data.games.forEach(game => {

            const card =
                document.createElement("div");

            card.className = "game";

            card.onclick = () => {
                openGame(game.file);
            };

            card.innerHTML = `
                <h2>${game.name}</h2>

                <p>
                    ${game.description}
                </p>

                <div class="game-info">
                    ${game.category} · ${game.type}
                </div>
            `;

            gamesContainer.appendChild(card);

        });

        /*
            If the page was restored after
            rotation and the URL still says
            #game, restore the game.
        */

        if (location.hash === "#game") {

            const savedGame =
                sessionStorage.getItem(
                    "zenplay-current-game"
                );

            const savedScroll =
                sessionStorage.getItem(
                    "zenplay-scroll-position"
                );

            if (savedGame) {

                savedScrollPosition =
                    savedScroll
                        ? Number(savedScroll)
                        : 0;

                showGame(savedGame);

            } else {

                /*
                    Invalid game state.
                    Remove the hash.
                */

                history.replaceState(
                    null,
                    "",
                    location.pathname +
                    location.search
                );

            }

        }

    } catch (error) {

        gamesContainer.innerHTML =
            "Unable to load games.";

        console.error(error);

    }
}


/* =========================
   OPEN GAME
========================= */

function openGame(file) {

    if (gameOpen) {
        return;
    }

    /*
        Save the exact scroll position.
    */

    savedScrollPosition =
        window.scrollY;

    /*
        Save the game so it can be
        restored if the browser restores
        the page during rotation.
    */

    sessionStorage.setItem(
        "zenplay-current-game",
        file
    );

    sessionStorage.setItem(
        "zenplay-scroll-position",
        String(savedScrollPosition)
    );

    currentGameFile = file;

    /*
        Add a browser history entry.

        The important part is that we use
        pushState instead of replacing the
        current page history entry.
    */

    if (location.hash !== "#game") {

        history.pushState(
            {
                zenplayGame: true
            },
            "",
            location.pathname +
            location.search +
            "#game"
        );

    }

    showGame(file);
}


/* =========================
   SHOW GAME
========================= */

function showGame(file) {

    gameOpen = true;
    currentGameFile = file;

    /*
        Save the state again.
    */

    sessionStorage.setItem(
        "zenplay-current-game",
        file
    );

    sessionStorage.setItem(
        "zenplay-scroll-position",
        String(savedScrollPosition)
    );

    /*
        Hide game list.
    */

    gamesContainer.style.display = "none";

    /*
        Make the entire page black.
    */

    document.body.classList.add("playing");

    /*
        Show game overlay.
    */

    gameOverlay.style.display = "block";

    /*
        Prevent background scrolling.
    */

    document.body.style.overflow = "hidden";

    /*
        Load game.
    */

    if (gameFrame.src !==
        new URL(file, location.href).href) {

        gameFrame.src = file;

    }

}


/* =========================
   CLOSE GAME
========================= */

function closeGame() {

    if (!gameOpen) {
        return;
    }

    /*
        Exit button behaves exactly like
        the phone's Back button.

        Going back removes #game and fires
        the popstate event.
    */

    if (location.hash === "#game") {

        history.back();

    } else {

        finishCloseGame();

    }

}


/* =========================
   ACTUALLY CLOSE GAME
========================= */

function finishCloseGame() {

    if (!gameOpen) {
        return;
    }

    gameOpen = false;

    currentGameFile = null;

    /*
        Stop the game completely.
    */

    gameFrame.src = "";

    /*
        Hide overlay.
    */

    gameOverlay.style.display = "none";

    /*
        Show games again.
    */

    gamesContainer.style.display = "";

    /*
        Restore normal page.
    */

    document.body.classList.remove("playing");

    /*
        Restore scrolling.
    */

    document.body.style.overflow = "";

    /*
        Remove saved game state.
    */

    sessionStorage.removeItem(
        "zenplay-current-game"
    );

    sessionStorage.removeItem(
        "zenplay-scroll-position"
    );

    /*
        Restore exact scroll position.
    */

    requestAnimationFrame(() => {

        window.scrollTo(
            0,
            savedScrollPosition
        );

    });

}


/* =========================
   BROWSER BACK BUTTON
========================= */

window.addEventListener(
    "popstate",
    event => {

        /*
            If the game is currently open
            and the browser went back,
            close the game.
        */

        if (
            gameOpen &&
            location.hash !== "#game"
        ) {

            finishCloseGame();

        }

    }
);


/* =========================
   HASH CHANGES
========================= */

window.addEventListener(
    "hashchange",
    () => {

        /*
            Going from #game to no hash
            means Back was pressed.
        */

        if (
            gameOpen &&
            location.hash !== "#game"
        ) {

            finishCloseGame();

        }

    }
);


/* =========================
   PAGE RESTORATION
========================= */

window.addEventListener(
    "pageshow",
    () => {

        /*
            If the browser restored the page
            and the URL still contains #game,
            restore the game.
        */

        if (
            location.hash === "#game" &&
            !gameOpen
        ) {

            const savedGame =
                sessionStorage.getItem(
                    "zenplay-current-game"
                );

            const savedScroll =
                sessionStorage.getItem(
                    "zenplay-scroll-position"
                );

            if (savedGame) {

                savedScrollPosition =
                    savedScroll
                        ? Number(savedScroll)
                        : 0;

                showGame(savedGame);

            }

        }

    }
);


/* =========================
   ROTATION / RESIZE
========================= */

window.addEventListener(
    "resize",
    () => {

        /*
            Keep the overlay locked to the
            viewport after orientation changes.
        */

        if (gameOpen) {

            gameOverlay.style.width =
                window.innerWidth + "px";

            gameOverlay.style.height =
                window.innerHeight + "px";

        }

    }
);


/* =========================
   LOAD
========================= */

loadGames();

</script>

</body>
</html>
