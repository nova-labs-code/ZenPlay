<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover">

    <title>ZenPlay</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #08090d;
            color: white;
        }

        body {
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            font-size: 3rem;
            margin: 0 0 10px;
        }

        .subtitle {
            color: #9da3b4;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(240px, 1fr)
            );
            gap: 20px;
        }

        .game {
            padding: 25px;
            border-radius: 18px;
            background: #11131a;
            border: 1px solid #242733;
            color: white;
            cursor: pointer;
            transition:
                transform 0.2s,
                border-color 0.2s;
        }

        .game:hover {
            transform: translateY(-4px);
            border-color: #4d556b;
        }

        .game h2 {
            margin: 0 0 10px;
        }

        .game p {
            margin: 0 0 15px;
            color: #9da3b4;
            line-height: 1.5;
        }

        .game-info {
            font-size: 0.85rem;
            color: #6f7688;
        }


        /* =========================
           GAME OVERLAY
        ========================= */

        #gameOverlay {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            background: #000;

            display: none;

            z-index: 1000;

            overflow: hidden;

            isolation: isolate;
        }

        #gameFrame {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            border: none;

            display: block;

            background: #000;

            z-index: 1001;
        }


        /* =========================
           EXIT BUTTON
        ========================= */

        #exitButton {
            position: fixed;

            top: max(
                16px,
                env(safe-area-inset-top)
            );

            right: max(
                16px,
                env(safe-area-inset-right)
            );

            z-index: 1003;

            padding: 10px 16px;

            border: none;
            border-radius: 10px;

            background: rgba(20, 20, 25, 0.85);
            color: white;

            font-size: 15px;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;

            touch-action: manipulation;

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        #exitButton:hover {
            background: rgba(40, 40, 48, 0.95);
        }

        #exitButton:active {
            transform: scale(0.96);
        }


        /* =========================
           PLAYING STATE
        ========================= */

        body.playing {
            background: #000;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>ZenPlay</h1>

    <p class="subtitle">
        Simple, satisfying games.
    </p>

    <div class="games" id="games">
        Loading games...
    </div>

</div>


<!-- GAME OVERLAY -->

<div id="gameOverlay">

    <button
        id="exitButton"
        type="button">
        Exit
    </button>

    <iframe
        id="gameFrame"
        allow="fullscreen">
    </iframe>

</div>


<script>

const gamesContainer =
    document.getElementById("games");

const gameOverlay =
    document.getElementById("gameOverlay");

const gameFrame =
    document.getElementById("gameFrame");

const exitButton =
    document.getElementById("exitButton");


let gameOpen = false;
let currentGameFile = null;
let savedScrollPosition = 0;


/* =========================
   NAVIGATION STATE
========================= */

/*
    ZenPlay uses one history entry for the
    game screen.

    The important part is that the Exit
    button NEVER calls history.back().

    This avoids relying on iOS WebKit's
    navigation stack after orientation
    changes.
*/

function setHomeState() {

    history.replaceState(
        {
            zenplay: "home"
        },
        "",
        location.pathname +
        location.search
    );
}


function setGameState(file) {

    history.pushState(
        {
            zenplay: "game",
            gameFile: file
        },
        "",
        location.pathname +
        location.search +
        "#game"
    );
}


/*
    Establish a known home state when
    ZenPlay first loads.
*/

if (
    !history.state ||
    !history.state.zenplay
) {

    history.replaceState(
        {
            zenplay: "home"
        },
        "",
        location.href
    );
}


/* =========================
   LOAD GAMES
========================= */

async function loadGames() {

    try {

        const response =
            await fetch("games.json");

        if (!response.ok) {
            throw new Error(
                "Could not load games.json"
            );
        }

        const data =
            await response.json();

        gamesContainer.innerHTML = "";

        data.games.forEach(game => {

            const card =
                document.createElement("div");

            card.className = "game";

            card.addEventListener(
                "click",
                () => openGame(game.file)
            );

            card.innerHTML = `
                <h2>${game.name}</h2>

                <p>
                    ${game.description}
                </p>

                <div class="game-info">
                    ${game.category} · ${game.type}
                </div>
            `;

            gamesContainer.appendChild(card);

        });

        restoreGameIfNeeded();

    } catch (error) {

        gamesContainer.innerHTML =
            "Unable to load games.";

        console.error(error);

    }
}


/* =========================
   OPEN GAME
========================= */

function openGame(file) {

    if (gameOpen) {
        return;
    }

    savedScrollPosition =
        window.scrollY;

    currentGameFile = file;

    sessionStorage.setItem(
        "zenplay-current-game",
        file
    );

    sessionStorage.setItem(
        "zenplay-scroll-position",
        String(savedScrollPosition)
    );

    /*
        Create exactly one game history
        entry.
    */

    setGameState(file);

    showGame(file);
}


/* =========================
   SHOW GAME
========================= */

function showGame(file) {

    gameOpen = true;
    currentGameFile = file;

    gamesContainer.style.display =
        "none";

    document.body.classList.add(
        "playing"
    );

    document.body.style.overflow =
        "hidden";

    gameOverlay.style.display =
        "block";

    updateGameViewport();

    const gameURL =
        new URL(
            file,
            window.location.href
        ).href;

    if (gameFrame.src !== gameURL) {
        gameFrame.src = file;
    }

    /*
        Make sure the Exit button is
        brought above the iframe after
        an iOS layout/orientation update.
    */

    exitButton.style.display =
        "block";

    exitButton.style.pointerEvents =
        "auto";
}


/* =========================
   EXIT BUTTON
========================= */

function closeGame() {

    if (!gameOpen) {
        return;
    }

    /*
        Do not use history.back().

        Directly close the game first.
    */

    finishCloseGame();

    /*
        Replace the current game state
        instead of navigating through the
        history stack.

        This is the important iOS Web App
        workaround.
    */

    setHomeState();
}


/* =========================
   FINISH CLOSE
========================= */

function finishCloseGame() {

    if (!gameOpen) {
        return;
    }

    gameOpen = false;
    currentGameFile = null;

    /*
        Disable the button before changing
        the overlay state.
    */

    exitButton.style.pointerEvents =
        "none";

    /*
        Stop the game completely.
    */

    gameFrame.src = "";

    /*
        Hide game UI.
    */

    gameOverlay.style.display =
        "none";

    gamesContainer.style.display =
        "";

    /*
        Restore normal document.
    */

    document.body.classList.remove(
        "playing"
    );

    document.body.style.overflow =
        "";

    /*
        Remove temporary state.
    */

    sessionStorage.removeItem(
        "zenplay-current-game"
    );

    sessionStorage.removeItem(
        "zenplay-scroll-position"
    );

    /*
        Restore the exact scroll position
        after iOS finishes its layout pass.
    */

    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            window.scrollTo(
                0,
                savedScrollPosition
            );

        });

    });

}


/* =========================
   BROWSER / IOS BACK
========================= */

/*
    If the user presses the browser's
    Back gesture/button while the game
    is open, the history entry changes
    from "game" to "home".

    We close the game.

    We do NOT call history.back()
    ourselves.
*/

window.addEventListener(
    "popstate",
    event => {

        if (!gameOpen) {
            return;
        }

        const state =
            event.state;

        if (
            !state ||
            state.zenplay !== "game"
        ) {

            finishCloseGame();

        }

    }
);


/* =========================
   HASH CHANGE
========================= */

/*
    iOS can sometimes report the URL/hash
    transition separately during Web App
    restoration.

    Treat leaving #game as leaving the
    game screen.
*/

window.addEventListener(
    "hashchange",
    () => {

        if (
            gameOpen &&
            location.hash !== "#game"
        ) {

            finishCloseGame();

        }

    }
);


/* =========================
   RESTORE GAME
========================= */

function restoreGameIfNeeded() {

    if (
        location.hash !== "#game" ||
        gameOpen
    ) {
        return;
    }

    const savedGame =
        sessionStorage.getItem(
            "zenplay-current-game"
        );

    const savedScroll =
        sessionStorage.getItem(
            "zenplay-scroll-position"
        );

    /*
        #game without a saved game means
        the navigation state is invalid.
    */

    if (!savedGame) {

        setHomeState();

        return;
    }

    savedScrollPosition =
        savedScroll
            ? Number(savedScroll)
            : 0;

    currentGameFile =
        savedGame;

    /*
        Give iOS time to finish restoring
        the Web App before loading the
        iframe.
    */

    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            showGame(savedGame);

        });

    });

}


/* =========================
   PAGE SHOW
========================= */

window.addEventListener(
    "pageshow",
    () => {

        restoreGameIfNeeded();

        updateGameViewport();

    }
);


/* =========================
   VIEWPORT
========================= */

function updateGameViewport() {

    if (!gameOpen) {
        return;
    }

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;

    gameOverlay.style.width =
        width + "px";

    gameOverlay.style.height =
        height + "px";

    gameFrame.style.width =
        width + "px";

    gameFrame.style.height =
        height + "px";

    /*
        Force the Exit button to remain
        interactive after an orientation
        change.
    */

    exitButton.style.zIndex =
        "1003";

    exitButton.style.pointerEvents =
        "auto";
}


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    () => {

        requestAnimationFrame(() => {
            updateGameViewport();
        });

    }
);


/* =========================
   ORIENTATION CHANGE
========================= */

window.addEventListener(
    "orientationchange",
    () => {

        /*
            iOS can perform several layout
            passes during rotation.

            Recalculate after each one.
        */

        updateGameViewport();

        setTimeout(
            updateGameViewport,
            50
        );

        setTimeout(
            updateGameViewport,
            150
        );

        setTimeout(
            updateGameViewport,
            300
        );

        setTimeout(
            updateGameViewport,
            500
        );

    }
);


/* =========================
   EXIT EVENTS
========================= */

/*
    pointerup is deliberately used in
    addition to click.

    This makes the control more reliable
    in iOS standalone Web Apps after
    orientation changes.
*/

exitButton.addEventListener(
    "pointerup",
    event => {

        event.preventDefault();

        closeGame();

    }
);

exitButton.addEventListener(
    "click",
    event => {

        event.preventDefault();

        /*
            pointerup normally handles iOS.

            This is a fallback for browsers
            that only fire click.
        */

        if (gameOpen) {
            closeGame();
        }

    }
);


/* =========================
   LOAD
========================= */

loadGames();

</script>

</body>
</html>
