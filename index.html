
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="ZenPlay"
    >

    <meta
        name="theme-color"
        content="#08090d"
    >

    <title>ZenPlay</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #08090d;

            overflow-x: hidden;
        }

        body {
            margin: 0;
            padding: 40px 20px;

            width: 100%;
            min-height: 100%;

            font-family: Arial, sans-serif;

            background: #08090d;
            color: white;

            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 900px;

            margin: auto;
        }

        h1 {
            font-size: 3rem;
            margin: 0 0 10px;
        }

        .subtitle {
            color: #9da3b4;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .games {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(240px, 1fr)
                );

            gap: 20px;
        }

        .game {
            padding: 25px;

            border-radius: 18px;

            background: #11131a;

            border: 1px solid #242733;

            color: white;

            cursor: pointer;

            transition:
                transform 0.2s,
                border-color 0.2s;

            -webkit-tap-highlight-color: transparent;

            touch-action: manipulation;
        }

        .game:hover {
            transform: translateY(-4px);
            border-color: #4d556b;
        }

        .game:active {
            transform: scale(0.985);
        }

        .game h2 {
            margin: 0 0 10px;
        }

        .game p {
            margin: 0 0 15px;

            color: #9da3b4;

            line-height: 1.5;
        }

        .game-info {
            font-size: 0.85rem;
            color: #6f7688;
        }

        /*
         * ========================================================
         * FOOTER
         * ========================================================
         */

        .site-footer {
            width: 100%;
            max-width: 900px;

            margin: 60px auto 0;
            padding: 30px 0 10px;

            border-top: 1px solid #242733;

            text-align: center;

            color: #6f7688;
        }

        .footer-content {
            display: flex;

            flex-direction: row;

            justify-content: center;
            align-items: center;

            gap: 10px;

            font-size: 0.85rem;

            line-height: 1.5;
        }

        .footer-link {
            color: #9da3b4;

            text-decoration: none;
        }

        .footer-link:hover {
            color: #ffffff;

            text-decoration: underline;
        }

        /*
         * ========================================================
         * PLAYING MODE
         * ========================================================
         */

        body.playing {
            padding: 0;
            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;

            overscroll-behavior: none;
        }

        body.playing .container,
        body.playing .site-footer {
            display: none;
        }

        /*
         * ========================================================
         * GAME OVERLAY
         * ========================================================
         */

        #gameOverlay {
            position: fixed;

            left: 0;
            top: 0;

            width: 100%;
            height: 100vh;
            height: 100dvh;

            margin: 0;
            padding: 0;

            background: #000;

            display: none;

            overflow: hidden;

            z-index: 1000;

            /*
             * Do not block interaction inside
             * the iframe.
             */

            touch-action: auto;

            overscroll-behavior: none;
        }

        /*
         * ========================================================
         * GAME FRAME
         * ========================================================
         */

        #gameFrame {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            border: 0;

            display: block;

            background: #000;

            z-index: 1;

            max-width: 100%;
            max-height: 100%;

            /*
             * Important for touch-based games.
             */

            touch-action: auto;

            -webkit-overflow-scrolling: touch;
        }

        /*
         * ========================================================
         * GAME LOADING SCREEN
         * ========================================================
         */

        #loadingScreen {
            position: absolute;

            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            background: #08090d;

            color: #9da3b4;

            font-size: 14px;

            z-index: 5;

            pointer-events: none;
        }

        #gameOverlay.loading #loadingScreen {
            display: flex;
        }

        /*
         * ========================================================
         * GAME CONTROLS
         * ========================================================
         */

        #gameControls {
            position: fixed;

            left: 0;
            top: 0;

            width: 100%;
            height: 100vh;
            height: 100dvh;

            margin: 0;
            padding: 0;

            display: none;

            overflow: hidden;

            z-index: 2000;

            /*
             * Allows game interaction everywhere
             * except on the exit button.
             */

            pointer-events: none;
        }

        /*
         * ========================================================
         * EXIT BUTTON
         * ========================================================
         */

        #exitButton {
            position: absolute;

            top:
                calc(
                    16px +
                    env(safe-area-inset-top)
                );

            right:
                max(
                    16px,
                    env(safe-area-inset-right)
                );

            max-width:
                calc(
                    100% -
                    32px -
                    env(safe-area-inset-right)
                );

            padding: 10px 16px;

            border: none;

            border-radius: 10px;

            background:
                rgba(
                    20,
                    20,
                    25,
                    0.85
                );

            color: white;

            font-size: 15px;

            cursor: pointer;

            pointer-events: auto;

            touch-action: manipulation;

            -webkit-tap-highlight-color: transparent;

            z-index: 2001;

            -webkit-backdrop-filter:
                blur(10px);

            backdrop-filter:
                blur(10px);
        }

        #exitButton:hover {
            background:
                rgba(
                    40,
                    40,
                    48,
                    0.95
                );
        }

        #exitButton:active {
            background:
                rgba(
                    55,
                    55,
                    65,
                    0.95
                );
        }

        /*
         * ========================================================
         * MOBILE
         * ========================================================
         */

        @media (max-width: 600px) {

            body {
                padding: 30px 16px;
            }

            h1 {
                font-size: 2.5rem;
            }

            .games {
                grid-template-columns: 1fr;
            }

        }

        /*
         * ========================================================
         * STANDALONE MODE
         * ========================================================
         */

        @media all and (display-mode: standalone) {

            html {
                width: 100%;
                height: 100%;

                overflow: hidden;
            }

            body {
                width: 100%;
                min-height: 100%;

                overflow-x: hidden;
            }

            #gameOverlay,
            #gameControls {
                height: 100%;
                height: 100dvh;
            }

        }

    </style>
</head>

<body>

    <div class="container">

        <h1>
            ZenPlay
        </h1>

        <p class="subtitle">
            Simple, satisfying games.
        </p>

        <div
            class="games"
            id="games"
        >
            Loading games...
        </div>

    </div>

    <footer class="site-footer">

        <div class="footer-content">

            <a
                class="footer-link"
                href="https://github.com/nova-labs-code"
            >
                <strong>
                    Nova Labs Code
                </strong>
            </a>

            <span>
                ·
            </span>

            <a
                class="footer-link"
                href="license.html"
            >
                <strong>
                    License
                </strong>
            </a>

        </div>

    </footer>

    <div id="gameOverlay">

        <div id="loadingScreen">
            Loading game...
        </div>

        <iframe
            id="gameFrame"
            title="ZenPlay game"
            allow="fullscreen"
            allowfullscreen
            scrolling="no">
        </iframe>

    </div>

    <div id="gameControls">

        <button
            id="exitButton"
            type="button"
            aria-label="Exit game">

            Exit

        </button>

    </div>

    <script src="watermark.js" defer></script>

    <script>

        /*
         * ========================================================
         * ELEMENTS
         * ========================================================
         */

        const gamesContainer =
            document.getElementById(
                "games"
            );

        const gameOverlay =
            document.getElementById(
                "gameOverlay"
            );

        const gameControls =
            document.getElementById(
                "gameControls"
            );

        const gameFrame =
            document.getElementById(
                "gameFrame"
            );

        const exitButton =
            document.getElementById(
                "exitButton"
            );


        /*
         * ========================================================
         * STATE
         * ========================================================
         */

        let gameOpen = false;

        let resizeTimer = null;

        let rotationTimer = null;

        let loadTimer = null;

        let homeScrollPosition = 0;

        let currentGame = "";

        let gameLoadVersion = 0;


        /*
         * ========================================================
         * LOAD GAMES
         * ========================================================
         */

        async function loadGames() {

            try {

                const response =
                    await fetch(
                        "games.json",
                        {
                            cache: "no-cache"
                        }
                    );

                if (!response.ok) {

                    throw new Error(
                        "Could not load games.json"
                    );

                }

                const data =
                    await response.json();

                if (
                    !data ||
                    !Array.isArray(data.games)
                ) {

                    throw new Error(
                        "Invalid games.json format"
                    );

                }

                gamesContainer.innerHTML =
                    "";

                data.games.forEach(
                    game => {

                        const card =
                            document.createElement(
                                "div"
                            );

                        card.className =
                            "game";

                        card.setAttribute(
                            "role",
                            "button"
                        );

                        card.setAttribute(
                            "tabindex",
                            "0"
                        );

                        /*
                         * Create content safely.
                         */

                        const heading =
                            document.createElement(
                                "h2"
                            );

                        heading.textContent =
                            game.name || "Untitled game";

                        const description =
                            document.createElement(
                                "p"
                            );

                        description.textContent =
                            game.description || "";

                        const info =
                            document.createElement(
                                "div"
                            );

                        info.className =
                            "game-info";

                        info.textContent =
                            `${game.category || "Game"} · ${game.type || "Interactive"}`;

                        card.append(
                            heading,
                            description,
                            info
                        );


                        /*
                         * Mouse and touch interaction.
                         */

                        card.addEventListener(
                            "click",
                            () => {

                                openGame(
                                    game.file
                                );

                            }
                        );


                        /*
                         * Keyboard interaction.
                         */

                        card.addEventListener(
                            "keydown",
                            event => {

                                if (
                                    event.key === "Enter" ||
                                    event.key === " "
                                ) {

                                    event.preventDefault();

                                    openGame(
                                        game.file
                                    );

                                }

                            }
                        );

                        gamesContainer.appendChild(
                            card
                        );

                    }
                );

            } catch (error) {

                gamesContainer.textContent =
                    "Unable to load games.";

                console.error(error);

            }

        }


        /*
         * ========================================================
         * GET LAYOUT VIEWPORT
         * ========================================================
         */

        function getViewportSize() {

            /*
             * visualViewport is more accurate on
             * mobile Safari when browser controls
             * appear or disappear.
             */

            const visual =
                window.visualViewport;

            const root =
                document.documentElement;

            const width =
                visual && visual.width
                    ? visual.width
                    : root.clientWidth || window.innerWidth;

            const height =
                visual && visual.height
                    ? visual.height
                    : root.clientHeight || window.innerHeight;

            return {

                width: Math.max(
                    1,
                    Math.round(width)
                ),

                height: Math.max(
                    1,
                    Math.round(height)
                )

            };

        }


        /*
         * ========================================================
         * UPDATE GAME VIEWPORT
         * ========================================================
         */

        function updateGameViewport() {

            if (!gameOpen) {
                return;
            }

            const viewport =
                getViewportSize();

            const width =
                viewport.width;

            const height =
                viewport.height;


            /*
             * Update overlay.
             */

            gameOverlay.style.left =
                "0px";

            gameOverlay.style.top =
                "0px";

            gameOverlay.style.width =
                width + "px";

            gameOverlay.style.height =
                height + "px";


            /*
             * Update iframe.
             */

            gameFrame.style.left =
                "0px";

            gameFrame.style.top =
                "0px";

            gameFrame.style.width =
                width + "px";

            gameFrame.style.height =
                height + "px";


            /*
             * Update controls.
             */

            gameControls.style.left =
                "0px";

            gameControls.style.top =
                "0px";

            gameControls.style.width =
                width + "px";

            gameControls.style.height =
                height + "px";

        }


        /*
         * ========================================================
         * FORCE LAYOUT
         * ========================================================
         */

        function forceLayout() {

            void document.documentElement.offsetHeight;

            void gameOverlay.offsetHeight;

            void gameFrame.offsetHeight;

            void gameControls.offsetHeight;

            void exitButton.offsetHeight;

        }


        /*
         * ========================================================
         * ROTATION
         * ========================================================
         */

        function resyncAfterRotation() {

            if (!gameOpen) {
                return;
            }

            clearTimeout(
                rotationTimer
            );


            /*
             * Wait for the browser to finish
             * changing orientation.
             */

            rotationTimer =
                setTimeout(
                    () => {

                        if (!gameOpen) {
                            return;
                        }

                        requestAnimationFrame(
                            () => {

                                forceLayout();

                                updateGameViewport();

                                requestAnimationFrame(
                                    () => {

                                        forceLayout();

                                        updateGameViewport();

                                    }
                                );

                            }
                        );

                    },
                    150
                );

        }


        /*
         * ========================================================
         * NORMAL RESIZE
         * ========================================================
         */

        function scheduleResize() {

            if (!gameOpen) {
                return;
            }

            clearTimeout(
                resizeTimer
            );


            /*
             * Avoid repeatedly forcing layout.
             * Only update when the browser has
             * had time to settle.
             */

            resizeTimer =
                setTimeout(
                    () => {

                        if (!gameOpen) {
                            return;
                        }

                        requestAnimationFrame(
                            () => {

                                updateGameViewport();

                            }
                        );

                    },
                    120
                );

        }


        /*
         * ========================================================
         * GAME LOADING
         * ========================================================
         */

        function handleGameLoaded(version) {

            if (
                !gameOpen ||
                version !== gameLoadVersion
            ) {
                return;
            }

            clearTimeout(
                loadTimer
            );

            /*
             * Remove loading screen.
             */

            gameOverlay.classList.remove(
                "loading"
            );


            /*
             * Give the game frame focus.
             * This helps games using keyboard
             * controls where supported.
             */

            try {

                gameFrame.contentWindow.focus();

            } catch (error) {

                console.warn(
                    "Could not focus game frame.",
                    error
                );

            }

        }


        /*
         * ========================================================
         * OPEN GAME
         * ========================================================
         */

        function openGame(file) {

            if (
                gameOpen ||
                !file ||
                typeof file !== "string"
            ) {
                return;
            }


            /*
             * Save the ZenPlay Home Screen
             * position before hiding it.
             */

            homeScrollPosition =
                window.scrollY ||
                window.pageYOffset ||
                0;


            gameOpen = true;

            currentGame = file;

            gameLoadVersion++;

            const thisLoadVersion =
                gameLoadVersion;


            /*
             * Freeze the Home Screen.
             */

            document.documentElement.style.overflow =
                "hidden";

            document.body.style.overflow =
                "hidden";

            document.body.classList.add(
                "playing"
            );


            /*
             * Show game layers.
             */

            gameOverlay.style.display =
                "block";

            gameOverlay.classList.add(
                "loading"
            );

            gameControls.style.display =
                "block";


            /*
             * Establish the viewport before
             * assigning the game URL.
             */

            gameFrame.style.visibility =
                "hidden";

            gameFrame.style.width =
                "100%";

            gameFrame.style.height =
                "100%";


            forceLayout();

            updateGameViewport();


            /*
             * Register load handlers before
             * starting the navigation.
             */

            gameFrame.onload =
                () => {

                    handleGameLoaded(
                        thisLoadVersion
                    );

                };

            gameFrame.onerror =
                () => {

                    if (
                        !gameOpen ||
                        thisLoadVersion !== gameLoadVersion
                    ) {
                        return;
                    }

                    clearTimeout(
                        loadTimer
                    );

                    gameOverlay.classList.remove(
                        "loading"
                    );

                    console.error(
                        "Game failed to load:",
                        currentGame
                    );

                };


            /*
             * Load game.
             */

            gameFrame.src =
                file;


            /*
             * Show the frame after the initial
             * layout has been established.
             */

            requestAnimationFrame(
                () => {

                    if (!gameOpen) {
                        return;
                    }

                    forceLayout();

                    updateGameViewport();

                    gameFrame.style.visibility =
                        "visible";

                }
            );


            /*
             * Fallback in case a browser does not
             * fire the load event as expected.
             */

            loadTimer =
                setTimeout(
                    () => {

                        if (
                            gameOpen &&
                            thisLoadVersion === gameLoadVersion
                        ) {

                            gameOverlay.classList.remove(
                                "loading"
                            );

                            gameFrame.style.visibility =
                                "visible";

                        }

                    },
                    10000
                );

        }


        /*
         * ========================================================
         * CLOSE GAME
         * ========================================================
         */

        function closeGame() {

            if (!gameOpen) {
                return;
            }

            gameOpen = false;

            currentGame = "";

            gameLoadVersion++;


            clearTimeout(
                resizeTimer
            );

            clearTimeout(
                rotationTimer
            );

            clearTimeout(
                loadTimer
            );


            /*
             * Stop the game.
             */

            gameFrame.onload = null;

            gameFrame.onerror = null;

            gameFrame.src =
                "about:blank";

            gameFrame.style.visibility =
                "hidden";


            /*
             * Hide game layers.
             */

            gameOverlay.style.display =
                "none";

            gameOverlay.classList.remove(
                "loading"
            );

            gameControls.style.display =
                "none";


            /*
             * Restore Home Screen.
             */

            document.body.classList.remove(
                "playing"
            );

            document.body.style.overflow =
                "";

            document.documentElement.style.overflow =
                "";


            /*
             * Reset iframe dimensions.
             */

            gameFrame.style.width =
                "";

            gameFrame.style.height =
                "";

            gameFrame.style.left =
                "";

            gameFrame.style.top =
                "";

            gameFrame.style.visibility =
                "";


            /*
             * Reset overlay dimensions.
             */

            gameOverlay.style.width =
                "";

            gameOverlay.style.height =
                "";

            gameOverlay.style.left =
                "";

            gameOverlay.style.top =
                "";


            /*
             * Restore the Home Screen to
             * exactly where it was.
             */

            requestAnimationFrame(
                () => {

                    window.scrollTo(
                        0,
                        homeScrollPosition
                    );

                }
            );

        }


        /*
         * ========================================================
         * EXIT BUTTON
         * ========================================================
         */

        exitButton.addEventListener(
            "click",
            closeGame
        );


        /*
         * ========================================================
         * ROTATION EVENTS
         * ========================================================
         */

        window.addEventListener(
            "orientationchange",
            () => {

                resyncAfterRotation();

            },
            {
                passive: true
            }
        );


        /*
         * ========================================================
         * RESIZE EVENTS
         * ========================================================
         */

        window.addEventListener(
            "resize",
            () => {

                scheduleResize();

            },
            {
                passive: true
            }
        );


        /*
         * ========================================================
         * VISUAL VIEWPORT EVENTS
         * ========================================================
         */

        if (window.visualViewport) {

            window.visualViewport.addEventListener(
                "resize",
                () => {

                    scheduleResize();

                },
                {
                    passive: true
                }
            );

        }


        /*
         * ========================================================
         * PAGE VISIBILITY
         * ========================================================
         */

        document.addEventListener(
            "visibilitychange",
            () => {

                if (
                    !document.hidden &&
                    gameOpen
                ) {

                    scheduleResize();

                }

            }
        );


        /*
         * ========================================================
         * LOAD
         * ========================================================
         */

        loadGames();

    </script>

</body>
</html>
