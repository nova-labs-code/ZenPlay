<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1.0,
            maximum-scale=1.0,
            user-scalable=no,
            viewport-fit=cover
        "
    >

    <title>ZenPlay</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #08090d;
            color: white;
        }

        body {
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            font-size: 3rem;
            margin: 0 0 10px;
        }

        .subtitle {
            color: #9da3b4;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(240px, 1fr)
            );
            gap: 20px;
        }

        .game {
            padding: 25px;
            border-radius: 18px;
            background: #11131a;
            border: 1px solid #242733;
            color: white;
            cursor: pointer;
            transition:
                transform 0.2s,
                border-color 0.2s;
        }

        .game:hover {
            transform: translateY(-4px);
            border-color: #4d556b;
        }

        .game h2 {
            margin: 0 0 10px;
        }

        .game p {
            margin: 0 0 15px;
            color: #9da3b4;
            line-height: 1.5;
        }

        .game-info {
            font-size: 0.85rem;
            color: #6f7688;
        }

        /*
            Game overlay

            Absolute positioning avoids the iOS fixed-position
            touch-coordinate problem during rotation.
        */

        #gameOverlay {
            position: absolute;

            left: 0;
            top: 0;

            width: 100vw;
            height: 100vh;

            background: #000;

            display: none;

            z-index: 1000;

            overflow: hidden;

            margin: 0;
            padding: 0;
        }

        #gameFrame {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            border: none;

            display: block;

            background: #000;

            z-index: 1001;

            margin: 0;
            padding: 0;
        }

        /*
            Exit button

            This element is intentionally recreated after
            rotation so iOS gets a completely new hit-test
            target.
        */

        .exit-button {
            position: absolute;

            top: calc(
                16px + env(safe-area-inset-top)
            );

            right: calc(
                16px + env(safe-area-inset-right)
            );

            z-index: 1002;

            padding: 10px 16px;

            border: none;
            border-radius: 10px;

            background: rgba(20, 20, 25, 0.85);
            color: white;

            font-size: 15px;

            cursor: pointer;

            touch-action: manipulation;

            -webkit-tap-highlight-color: transparent;

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .exit-button:hover {
            background: rgba(40, 40, 48, 0.95);
        }

        body.playing {
            background: #000;
            padding: 0;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>ZenPlay</h1>

    <p class="subtitle">
        Simple, satisfying games.
    </p>

    <div class="games" id="games">
        Loading games...
    </div>

</div>


<div id="gameOverlay">

    <button
        id="exitButton"
        class="exit-button"
        type="button"
    >
        Exit
    </button>

    <iframe
        id="gameFrame"
        allow="fullscreen"
    ></iframe>

</div>


<script>

const gamesContainer =
    document.getElementById("games");

const gameOverlay =
    document.getElementById("gameOverlay");

const gameFrame =
    document.getElementById("gameFrame");


let savedScrollPosition = 0;

let viewportSyncTimer = null;

let rotationTimer = null;


/*
    Get the current document viewport.

    clientWidth/clientHeight are preferred because they
    represent the layout viewport used by the page.
*/

function getViewportSize() {

    const width =
        document.documentElement.clientWidth ||
        window.innerWidth;

    const height =
        document.documentElement.clientHeight ||
        window.innerHeight;

    return {
        width,
        height
    };
}


/*
    Update the game viewport.
*/

function updateGameViewport() {

    if (
        gameOverlay.style.display === "none" ||
        !document.body.classList.contains("playing")
    ) {
        return;
    }

    const viewport =
        getViewportSize();


    /*
        Keep the overlay aligned with the document
        position where the game was opened.
    */

    gameOverlay.style.left = "0px";

    gameOverlay.style.top =
        savedScrollPosition + "px";

    gameOverlay.style.width =
        viewport.width + "px";

    gameOverlay.style.height =
        viewport.height + "px";


    /*
        Explicitly size the iframe.
    */

    gameFrame.style.left = "0px";

    gameFrame.style.top = "0px";

    gameFrame.style.width =
        viewport.width + "px";

    gameFrame.style.height =
        viewport.height + "px";
}


/*
    Force a layout calculation.

    This makes WebKit resolve the new geometry before
    we recreate the button.
*/

function forceLayout() {

    void document.documentElement.offsetHeight;

    void gameOverlay.offsetWidth;

    void gameFrame.offsetWidth;
}


/*
    Create a completely new Exit button.

    The old button is removed from the DOM first.
    This is intentional: after iOS rotation, the old
    element can retain stale touch geometry.
*/

function rebuildExitButton() {

    if (
        !document.body.classList.contains("playing")
    ) {
        return;
    }


    const oldButton =
        document.getElementById("exitButton");


    if (oldButton) {

        oldButton.remove();

    }


    /*
        Create a brand-new button.
    */

    const newButton =
        document.createElement("button");


    newButton.id =
        "exitButton";

    newButton.className =
        "exit-button";

    newButton.type =
        "button";

    newButton.textContent =
        "Exit";


    /*
        Add it back to the overlay.
    */

    gameOverlay.appendChild(
        newButton
    );


    /*
        Force WebKit to calculate the new button's
        layout and hit-test region.
    */

    void newButton.offsetWidth;


    /*
        Direct pointer handler.
    */

    newButton.addEventListener(
        "pointerup",
        event => {

            event.preventDefault();

            closeGame();

        },
        {
            passive: false
        }
    );


    /*
        Touch fallback for iOS.
    */

    newButton.addEventListener(
        "touchend",
        event => {

            event.preventDefault();

            closeGame();

        },
        {
            passive: false
        }
    );


    /*
        Normal click fallback.
    */

    newButton.addEventListener(
        "click",
        event => {

            event.preventDefault();

            closeGame();

        }
    );
}


/*
    Rebuild everything after rotation has settled.

    The repeated passes are deliberate because iOS can
    report intermediate viewport dimensions while the
    orientation transition is still finishing.
*/

function resyncAfterRotation() {

    if (
        !document.body.classList.contains("playing")
    ) {
        return;
    }


    clearTimeout(
        rotationTimer
    );


    /*
        First rendering pass.
    */

    requestAnimationFrame(() => {

        forceLayout();

        updateGameViewport();


        /*
            Second rendering pass.
        */

        requestAnimationFrame(() => {

            forceLayout();

            updateGameViewport();


            /*
                Wait for the rotation UI to settle.
            */

            rotationTimer =
                setTimeout(() => {

                    requestAnimationFrame(() => {

                        forceLayout();

                        updateGameViewport();

                        /*
                            Recreate the button only
                            after the viewport is stable.
                        */

                        rebuildExitButton();


                        /*
                            One final viewport pass.
                        */

                        requestAnimationFrame(() => {

                            forceLayout();

                            updateGameViewport();

                        });

                    });

                }, 200);

        });

    });
}


/*
    Handle normal viewport changes.
*/

function scheduleViewportSync() {

    if (
        !document.body.classList.contains("playing")
    ) {
        return;
    }


    clearTimeout(
        viewportSyncTimer
    );


    requestAnimationFrame(() => {

        forceLayout();

        updateGameViewport();


        viewportSyncTimer =
            setTimeout(() => {

                requestAnimationFrame(() => {

                    forceLayout();

                    updateGameViewport();

                });

            }, 100);

    });
}


/*
    Load games.
*/

async function loadGames() {

    try {

        const response =
            await fetch("games.json");


        if (!response.ok) {

            throw new Error(
                "Could not load games.json"
            );

        }


        const data =
            await response.json();


        gamesContainer.innerHTML =
            "";


        data.games.forEach(game => {

            const card =
                document.createElement("div");


            card.className =
                "game";


            card.onclick = () => {

                openGame(
                    game.file
                );

            };


            card.innerHTML = `
                <h2>${game.name}</h2>

                <p>
                    ${game.description}
                </p>

                <div class="game-info">
                    ${game.category} · ${game.type}
                </div>
            `;


            gamesContainer.appendChild(
                card
            );

        });

    } catch (error) {

        gamesContainer.innerHTML =
            "Unable to load games.";

        console.error(error);

    }

}


/*
    Open a game.
*/

function openGame(file) {

    /*
        Save the current page position.
    */

    savedScrollPosition =
        window.scrollY;


    /*
        Hide the game list.
    */

    gamesContainer.style.display =
        "none";


    /*
        Enter playing mode.
    */

    document.body.classList.add(
        "playing"
    );


    /*
        Prevent page scrolling.
    */

    document.body.style.overflow =
        "hidden";


    /*
        Show the game overlay.
    */

    gameOverlay.style.display =
        "block";


    /*
        Load the game.
    */

    gameFrame.src =
        file;


    /*
        Initial viewport setup.
    */

    requestAnimationFrame(() => {

        updateGameViewport();

        rebuildExitButton();

    });

}


/*
    Close the game.
*/

function closeGame() {

    /*
        Stop the game.
    */

    gameFrame.src =
        "";


    /*
        Hide the overlay.
    */

    gameOverlay.style.display =
        "none";


    /*
        Show the games.
    */

    gamesContainer.style.display =
        "";


    /*
        Leave playing mode.
    */

    document.body.classList.remove(
        "playing"
    );


    /*
        Restore scrolling.
    */

    document.body.style.overflow =
        "";


    /*
        Cancel pending syncs.
    */

    clearTimeout(
        viewportSyncTimer
    );

    clearTimeout(
        rotationTimer
    );


    /*
        Restore the exact position.
    */

    requestAnimationFrame(() => {

        window.scrollTo(
            0,
            savedScrollPosition
        );

    });

}


/*
    Orientation change.

    Wait for the rotation to finish before rebuilding
    the button.
*/

window.addEventListener(
    "orientationchange",
    () => {

        resyncAfterRotation();

    }
);


/*
    Window resize.
*/

window.addEventListener(
    "resize",
    () => {

        scheduleViewportSync();

    }
);


/*
    visualViewport resize.

    This catches additional iOS viewport changes that
    may happen separately from window.resize.
*/

if (window.visualViewport) {

    window.visualViewport.addEventListener(
        "resize",
        () => {

            scheduleViewportSync();

        }
    );

}


/*
    Load the games.
*/

loadGames();

</script>

</body>
</html>
