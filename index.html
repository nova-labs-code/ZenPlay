<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover">

    <title>ZenPlay</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #08090d;
            color: white;
        }

        body {
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            font-size: 3rem;
            margin: 0 0 10px;
        }

        .subtitle {
            color: #9da3b4;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(240px, 1fr)
            );
            gap: 20px;
        }

        .game {
            padding: 25px;
            border-radius: 18px;
            background: #11131a;
            border: 1px solid #242733;
            color: white;
            cursor: pointer;
            transition:
                transform 0.2s,
                border-color 0.2s;
        }

        .game:hover {
            transform: translateY(-4px);
            border-color: #4d556b;
        }

        .game h2 {
            margin: 0 0 10px;
        }

        .game p {
            margin: 0 0 15px;
            color: #9da3b4;
            line-height: 1.5;
        }

        .game-info {
            font-size: 0.85rem;
            color: #6f7688;
        }


        /* =========================
           GAME OVERLAY
        ========================= */

        #gameOverlay {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            background: #000;

            display: none;

            z-index: 1000;

            overflow: hidden;

            isolation: isolate;
        }

        #gameFrame {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            border: none;

            display: block;

            background: #000;

            z-index: 1001;
        }


        /* =========================
           EXIT BUTTON
        ========================= */

        #exitButton {
            position: fixed;

            top: calc(
                16px + env(safe-area-inset-top)
            );

            right: calc(
                16px + env(safe-area-inset-right)
            );

            z-index: 1003;

            padding: 10px 16px;

            border: none;
            border-radius: 10px;

            background: rgba(20, 20, 25, 0.85);
            color: white;

            font-size: 15px;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;

            touch-action: manipulation;

            pointer-events: auto;

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            /*
                Keep the button on its own
                compositing layer.

                This helps iOS WebKit recalculate
                its touch region after rotation.
            */

            transform: translateZ(0);
            -webkit-transform: translateZ(0);

            will-change: top, right, transform;
        }

        #exitButton:hover {
            background: rgba(40, 40, 48, 0.95);
        }

        #exitButton:active {
            transform: translateZ(0) scale(0.96);
            -webkit-transform: translateZ(0) scale(0.96);
        }


        /* =========================
           PLAYING STATE
        ========================= */

        body.playing {
            background: #000;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>ZenPlay</h1>

    <p class="subtitle">
        Simple, satisfying games.
    </p>

    <div class="games" id="games">
        Loading games...
    </div>

</div>


<!-- GAME OVERLAY -->

<div id="gameOverlay">

    <button
        id="exitButton"
        type="button">
        Exit
    </button>

    <iframe
        id="gameFrame"
        allow="fullscreen">
    </iframe>

</div>


<script>

const gamesContainer =
    document.getElementById("games");

const gameOverlay =
    document.getElementById("gameOverlay");

const gameFrame =
    document.getElementById("gameFrame");

const exitButton =
    document.getElementById("exitButton");


let savedScrollPosition = 0;
let gameOpen = false;
let currentGameFile = null;


/* =========================
   HISTORY
========================= */

if (
    !history.state ||
    !history.state.zenplay
) {

    history.replaceState(
        {
            zenplay: "home"
        },
        "",
        location.href
    );
}


/* =========================
   LOAD GAMES
========================= */

async function loadGames() {

    try {

        const response =
            await fetch("games.json");

        if (!response.ok) {
            throw new Error(
                "Could not load games.json"
            );
        }

        const data =
            await response.json();

        gamesContainer.innerHTML = "";

        data.games.forEach(game => {

            const card =
                document.createElement("div");

            card.className = "game";

            card.addEventListener(
                "click",
                () => openGame(game.file)
            );

            card.innerHTML = `
                <h2>${game.name}</h2>

                <p>
                    ${game.description}
                </p>

                <div class="game-info">
                    ${game.category} · ${game.type}
                </div>
            `;

            gamesContainer.appendChild(card);

        });

        restoreGameIfNeeded();

    } catch (error) {

        gamesContainer.innerHTML =
            "Unable to load games.";

        console.error(error);

    }
}


/* =========================
   OPEN GAME
========================= */

function openGame(file) {

    if (gameOpen) {
        return;
    }

    savedScrollPosition =
        window.scrollY;

    currentGameFile = file;

    sessionStorage.setItem(
        "zenplay-current-game",
        file
    );

    sessionStorage.setItem(
        "zenplay-scroll-position",
        String(savedScrollPosition)
    );

    history.pushState(
        {
            zenplay: "game",
            gameFile: file
        },
        "",
        location.pathname +
        location.search +
        "#game"
    );

    showGame(file);
}


/* =========================
   SHOW GAME
========================= */

function showGame(file) {

    gameOpen = true;
    currentGameFile = file;

    gamesContainer.style.display =
        "none";

    document.body.classList.add(
        "playing"
    );

    document.body.style.overflow =
        "hidden";

    gameOverlay.style.display =
        "block";

    /*
        Force the overlay and button to
        be recalculated immediately.
    */

    updateGameViewport();

    const gameURL =
        new URL(
            file,
            window.location.href
        ).href;

    if (gameFrame.src !== gameURL) {
        gameFrame.src = file;
    }

    exitButton.style.pointerEvents =
        "auto";

    exitButton.style.display =
        "block";
}


/* =========================
   CLOSE GAME
========================= */

function closeGame() {

    if (!gameOpen) {
        return;
    }

    /*
        Close directly.

        No history.back().
    */

    finishCloseGame();

    /*
        Remove the #game state without
        asking iOS to navigate through
        its history stack.
    */

    history.replaceState(
        {
            zenplay: "home"
        },
        "",
        location.pathname +
        location.search
    );
}


/* =========================
   FINISH CLOSE
========================= */

function finishCloseGame() {

    if (!gameOpen) {
        return;
    }

    gameOpen = false;
    currentGameFile = null;

    exitButton.style.pointerEvents =
        "none";

    /*
        Stop iframe.
    */

    gameFrame.src = "";

    /*
        Hide game.
    */

    gameOverlay.style.display =
        "none";

    gamesContainer.style.display =
        "";

    document.body.classList.remove(
        "playing"
    );

    document.body.style.overflow =
        "";

    sessionStorage.removeItem(
        "zenplay-current-game"
    );

    sessionStorage.removeItem(
        "zenplay-scroll-position"
    );

    /*
        Let iOS finish the layout before
        restoring the scroll position.
    */

    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            window.scrollTo(
                0,
                savedScrollPosition
            );

        });

    });
}


/* =========================
   IOS / BROWSER BACK
========================= */

window.addEventListener(
    "popstate",
    event => {

        if (!gameOpen) {
            return;
        }

        if (
            !event.state ||
            event.state.zenplay !== "game"
        ) {

            finishCloseGame();

        }

    }
);


/* =========================
   HASH CHANGE
========================= */

window.addEventListener(
    "hashchange",
    () => {

        if (
            gameOpen &&
            location.hash !== "#game"
        ) {

            finishCloseGame();

        }

    }
);


/* =========================
   RESTORE GAME
========================= */

function restoreGameIfNeeded() {

    if (
        location.hash !== "#game" ||
        gameOpen
    ) {
        return;
    }

    const savedGame =
        sessionStorage.getItem(
            "zenplay-current-game"
        );

    const savedScroll =
        sessionStorage.getItem(
            "zenplay-scroll-position"
        );

    if (!savedGame) {

        history.replaceState(
            {
                zenplay: "home"
            },
            "",
            location.pathname +
            location.search
        );

        return;
    }

    savedScrollPosition =
        savedScroll
            ? Number(savedScroll)
            : 0;

    currentGameFile =
        savedGame;

    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            showGame(savedGame);

        });

    });
}


/* =========================
   PAGE SHOW
========================= */

window.addEventListener(
    "pageshow",
    () => {

        restoreGameIfNeeded();

        updateGameViewport();

    }
);


/* =========================
   VIEWPORT UPDATE
========================= */

function updateGameViewport() {

    if (!gameOpen) {
        return;
    }

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;


    /*
        Update overlay.
    */

    gameOverlay.style.width =
        width + "px";

    gameOverlay.style.height =
        height + "px";


    /*
        Update iframe.
    */

    gameFrame.style.width =
        width + "px";

    gameFrame.style.height =
        height + "px";


    /*
        IMPORTANT:

        Force iOS to invalidate the Exit
        button's old layout/hit-test data.
    */

    exitButton.style.top =
        "calc(16px + env(safe-area-inset-top))";

    exitButton.style.right =
        "calc(16px + env(safe-area-inset-right))";


    /*
        Force a synchronous layout read.

        This makes WebKit recalculate the
        button's geometry immediately.
    */

    void exitButton.offsetTop;

    void exitButton.offsetLeft;

    void exitButton.offsetWidth;

    void exitButton.offsetHeight;


    /*
        Re-establish its own compositing
        layer after the viewport changes.
    */

    exitButton.style.transform =
        "translateZ(0)";

    exitButton.style.webkitTransform =
        "translateZ(0)";
}


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    () => {

        updateGameViewport();

        setTimeout(
            updateGameViewport,
            50
        );

        setTimeout(
            updateGameViewport,
            150
        );

    }
);


/* =========================
   ORIENTATION CHANGE
========================= */

window.addEventListener(
    "orientationchange",
    () => {

        updateGameViewport();

        setTimeout(
            updateGameViewport,
            50
        );

        setTimeout(
            updateGameViewport,
            150
        );

        setTimeout(
            updateGameViewport,
            300
        );

        setTimeout(
            updateGameViewport,
            500
        );

    }
);


/* =========================
   VISUAL VIEWPORT
========================= */

if (window.visualViewport) {

    window.visualViewport.addEventListener(
        "resize",
        () => {

            updateGameViewport();

        }
    );

}


/* =========================
   EXIT BUTTON
========================= */

exitButton.addEventListener(
    "pointerup",
    event => {

        event.preventDefault();

        closeGame();

    }
);


/*
    Fallback for iOS/browser environments
    that deliver click instead of pointerup.
*/

exitButton.addEventListener(
    "click",
    event => {

        event.preventDefault();

        if (gameOpen) {
            closeGame();
        }

    }
);


/* =========================
   LOAD
========================= */

loadGames();

</script>

</body>
</html>
