<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover"
    >

    <title>ZenPlay</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #08090d;
            color: white;
        }

        body {
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            font-size: 3rem;
            margin: 0 0 10px;
        }

        .subtitle {
            color: #9da3b4;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(240px, 1fr)
            );
            gap: 20px;
        }

        .game {
            padding: 25px;
            border-radius: 18px;
            background: #11131a;
            border: 1px solid #242733;
            color: white;
            cursor: pointer;
            transition:
                transform 0.2s,
                border-color 0.2s;
        }

        .game:hover {
            transform: translateY(-4px);
            border-color: #4d556b;
        }

        .game h2 {
            margin: 0 0 10px;
        }

        .game p {
            margin: 0 0 15px;
            color: #9da3b4;
            line-height: 1.5;
        }

        .game-info {
            font-size: 0.85rem;
            color: #6f7688;
        }

        /*
         * Game viewport
         *
         * Absolute positioning is intentional.
         * Fixed positioning can cause stale touch/layout
         * coordinates on iOS after rotation.
         */
        #gameOverlay {
            position: absolute;

            left: 0;
            top: 0;

            width: 0;
            height: 0;

            background: #000;

            display: none;

            z-index: 1000;

            overflow: hidden;
        }

        /*
         * The iframe is its own game layer.
         */
        #gameFrame {
            position: absolute;

            left: 0;
            top: 0;

            width: 0;
            height: 0;

            border: none;

            display: block;

            background: #000;

            z-index: 1;

            /*
             * Prevent the iframe from affecting touch behavior
             * outside the exact game viewport.
             */
            max-width: 100%;
            max-height: 100%;
        }

        /*
         * Controls are a separate layer above the game.
         */
        #gameControls {
            position: absolute;

            left: 0;
            top: 0;

            width: 0;
            height: 0;

            z-index: 2000;

            pointer-events: none;
        }

        /*
         * Exit button
         */
        #exitButton {
            position: absolute;

            top: calc(
                16px + env(safe-area-inset-top)
            );

            right: calc(
                16px + env(safe-area-inset-right)
            );

            z-index: 2001;

            padding: 10px 16px;

            border: none;
            border-radius: 10px;

            background: rgba(20, 20, 25, 0.85);
            color: white;

            font-size: 15px;

            cursor: pointer;

            pointer-events: auto;

            touch-action: manipulation;

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        #exitButton:hover {
            background: rgba(40, 40, 48, 0.95);
        }

        /*
         * Black page while playing
         */
        body.playing {
            background: #000;
            padding: 0;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>ZenPlay</h1>

    <p class="subtitle">
        Simple, satisfying games.
    </p>

    <div class="games" id="games">
        Loading games...
    </div>

</div>

<!-- Game layer -->

<div id="gameOverlay">

    <iframe
        id="gameFrame"
        allow="fullscreen">
    </iframe>

</div>

<!-- UI layer -->

<div id="gameControls">

    <button id="exitButton">
        Exit
    </button>

</div>

<script>

const gamesContainer =
    document.getElementById("games");

const gameOverlay =
    document.getElementById("gameOverlay");

const gameFrame =
    document.getElementById("gameFrame");

const gameControls =
    document.getElementById("gameControls");

let savedScrollPosition = 0;

let viewportSyncTimer = null;


/*
 * Load games
 */

async function loadGames() {

    try {

        const response =
            await fetch("games.json");

        if (!response.ok) {
            throw new Error(
                "Could not load games.json"
            );
        }

        const data =
            await response.json();

        gamesContainer.innerHTML = "";

        data.games.forEach(game => {

            const card =
                document.createElement("div");

            card.className = "game";

            card.onclick = () => {
                openGame(game.file);
            };

            card.innerHTML = `
                <h2>${game.name}</h2>

                <p>
                    ${game.description}
                </p>

                <div class="game-info">
                    ${game.category} · ${game.type}
                </div>
            `;

            gamesContainer.appendChild(card);

        });

    } catch (error) {

        gamesContainer.innerHTML =
            "Unable to load games.";

        console.error(error);

    }
}


/*
 * Get the actual usable viewport.
 *
 * visualViewport is important on iOS because
 * innerHeight can temporarily contain stale
 * dimensions during rotation.
 */

function getViewportSize() {

    const visualViewport =
        window.visualViewport;

    if (
        visualViewport &&
        visualViewport.width > 0 &&
        visualViewport.height > 0
    ) {

        return {
            width: Math.round(
                visualViewport.width
            ),

            height: Math.round(
                visualViewport.height
            )
        };

    }

    const root =
        document.documentElement;

    return {
        width: Math.round(
            root.clientWidth ||
            window.innerWidth
        ),

        height: Math.round(
            root.clientHeight ||
            window.innerHeight
        )
    };
}


/*
 * Force the browser to finish any pending
 * layout calculation before measuring.
 */

function forceLayout() {

    void document.documentElement.offsetHeight;
    void gameOverlay.offsetHeight;
    void gameControls.offsetHeight;
    void gameFrame.offsetHeight;
}


/*
 * Update every game viewport dimension.
 *
 * Nothing is allowed to use 100vh here.
 */

function updateGameViewport() {

    if (
        gameOverlay.style.display === "none"
    ) {
        return;
    }

    const viewport =
        getViewportSize();

    const width =
        Math.max(1, viewport.width);

    const height =
        Math.max(1, viewport.height);

    /*
     * Both layers use exactly the same
     * physical viewport rectangle.
     */

    gameOverlay.style.left = "0px";

    gameOverlay.style.top =
        savedScrollPosition + "px";

    gameOverlay.style.width =
        width + "px";

    gameOverlay.style.height =
        height + "px";


    gameControls.style.left = "0px";

    gameControls.style.top =
        savedScrollPosition + "px";

    gameControls.style.width =
        width + "px";

    gameControls.style.height =
        height + "px";


    /*
     * Explicit iframe dimensions.
     *
     * This prevents the old landscape size
     * from remaining underneath the new
     * portrait viewport.
     */

    gameFrame.style.left = "0px";

    gameFrame.style.top = "0px";

    gameFrame.style.width =
        width + "px";

    gameFrame.style.height =
        height + "px";
}


/*
 * Rebuild the Exit button.
 *
 * This forces iOS/WebKit to create a fresh
 * hit-test target after rotation.
 */

function rebuildExitButton() {

    const oldButton =
        document.getElementById(
            "exitButton"
        );

    if (oldButton) {
        oldButton.remove();
    }

    const button =
        document.createElement("button");

    button.id = "exitButton";

    button.textContent = "Exit";

    button.type = "button";

    button.setAttribute(
        "aria-label",
        "Exit game"
    );

    gameControls.appendChild(button);

    /*
     * Force layout so WebKit recalculates
     * the button's physical hit rectangle.
     */

    void button.offsetWidth;
    void button.offsetHeight;

    button.addEventListener(
        "pointerup",
        event => {

            event.preventDefault();

            closeGame();

        },
        { passive: false }
    );

    button.addEventListener(
        "touchend",
        event => {

            event.preventDefault();

        },
        { passive: false }
    );

    button.addEventListener(
        "click",
        event => {

            event.preventDefault();

            closeGame();

        },
        { passive: false }
    );
}


/*
 * Full rotation resynchronization.
 *
 * iOS can fire the rotation event before
 * its viewport geometry is actually settled.
 *
 * So we intentionally wait for several
 * browser frames and then perform a final
 * delayed measurement.
 */

function resyncAfterRotation() {

    if (
        gameOverlay.style.display === "none"
    ) {
        return;
    }

    /*
     * Temporarily remove the iframe from
     * visibility while its dimensions and
     * compositing layer are rebuilt.
     */

    gameFrame.style.visibility =
        "hidden";


    requestAnimationFrame(() => {

        forceLayout();

        updateGameViewport();


        requestAnimationFrame(() => {

            forceLayout();

            updateGameViewport();

            rebuildExitButton();


            requestAnimationFrame(() => {

                forceLayout();

                updateGameViewport();


                /*
                 * iOS may perform one more
                 * viewport adjustment after
                 * the rotation animation.
                 */

                setTimeout(() => {

                    requestAnimationFrame(() => {

                        forceLayout();

                        updateGameViewport();

                        rebuildExitButton();

                        /*
                         * Now that the final
                         * geometry is known,
                         * restore the game.
                         */

                        gameFrame.style.visibility =
                            "visible";

                    });

                }, 200);

            });

        });

    });
}


/*
 * Normal viewport synchronization.
 */

function scheduleViewportSync() {

    if (
        gameOverlay.style.display === "none"
    ) {
        return;
    }

    clearTimeout(
        viewportSyncTimer
    );

    /*
     * Immediate correction.
     */

    updateGameViewport();


    /*
     * Wait for iOS layout to settle.
     */

    viewportSyncTimer =
        setTimeout(() => {

            requestAnimationFrame(() => {

                forceLayout();

                updateGameViewport();

            });

        }, 100);
}


/*
 * Open game
 */

function openGame(file) {

    savedScrollPosition =
        window.scrollY;

    gamesContainer.style.display =
        "none";

    document.body.classList.add(
        "playing"
    );

    document.body.style.overflow =
        "hidden";

    gameOverlay.style.display =
        "block";

    gameControls.style.display =
        "block";

    gameFrame.style.visibility =
        "hidden";

    gameFrame.src = file;


    /*
     * Establish the first viewport.
     */

    requestAnimationFrame(() => {

        forceLayout();

        updateGameViewport();

        rebuildExitButton();


        requestAnimationFrame(() => {

            forceLayout();

            updateGameViewport();

            gameFrame.style.visibility =
                "visible";

        });

    });

}


/*
 * Close game
 */

function closeGame() {

    gameFrame.style.visibility =
        "hidden";

    gameFrame.src = "";

    gameOverlay.style.display =
        "none";

    gameControls.style.display =
        "none";

    gamesContainer.style.display =
        "";

    document.body.classList.remove(
        "playing"
    );

    document.body.style.overflow =
        "";

    clearTimeout(
        viewportSyncTimer
    );

    requestAnimationFrame(() => {

        window.scrollTo(
            0,
            savedScrollPosition
        );

    });

}


/*
 * Rotation
 */

window.addEventListener(
    "orientationchange",
    () => {

        resyncAfterRotation();

    },
    { passive: true }
);


/*
 * Standard resize
 */

window.addEventListener(
    "resize",
    () => {

        scheduleViewportSync();

    },
    { passive: true }
);


/*
 * iOS visual viewport changes.
 */

if (window.visualViewport) {

    window.visualViewport.addEventListener(
        "resize",
        () => {

            scheduleViewportSync();

        },
        { passive: true }
    );

}


/*
 * Initial game list.
 */

loadGames();

</script>

</body>
</html>
