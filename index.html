<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover">

    <title>ZenPlay</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #08090d;
            color: white;
        }

        body {
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            font-size: 3rem;
            margin: 0 0 10px;
        }

        .subtitle {
            color: #9da3b4;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(240px, 1fr)
            );
            gap: 20px;
        }

        .game {
            padding: 25px;
            border-radius: 18px;
            background: #11131a;
            border: 1px solid #242733;
            color: white;
            cursor: pointer;
            transition:
                transform 0.2s,
                border-color 0.2s;
        }

        .game:hover {
            transform: translateY(-4px);
            border-color: #4d556b;
        }

        .game h2 {
            margin: 0 0 10px;
        }

        .game p {
            margin: 0 0 15px;
            color: #9da3b4;
            line-height: 1.5;
        }

        .game-info {
            font-size: 0.85rem;
            color: #6f7688;
        }

        /*
            Game overlay

            IMPORTANT:
            This is intentionally ABSOLUTE instead of FIXED.

            The overlay is positioned at the exact document
            scroll position where the user opened the game.
        */

        #gameOverlay {
            position: absolute;

            left: 0;
            top: 0;

            width: 100vw;
            height: 100vh;

            background: #000;

            display: none;

            z-index: 1000;

            overflow: hidden;

            touch-action: none;
        }

        #gameFrame {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            border: none;

            display: block;

            background: #000;

            z-index: 1001;

            touch-action: auto;
        }

        /*
            Exit button

            IMPORTANT:
            Also ABSOLUTE instead of FIXED.

            It is positioned relative to the game overlay,
            so WebKit does not have to hit-test a fixed element
            against a rotated viewport.
        */

        #exitButton {
            position: absolute;

            top: calc(
                16px + env(safe-area-inset-top)
            );

            right: calc(
                16px + env(safe-area-inset-right)
            );

            z-index: 1003;

            padding: 10px 16px;

            border: none;
            border-radius: 10px;

            background: rgba(20, 20, 25, 0.85);
            color: white;

            font-size: 15px;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;

            touch-action: manipulation;

            pointer-events: auto;

            user-select: none;
            -webkit-user-select: none;

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        #exitButton:hover {
            background: rgba(40, 40, 48, 0.95);
        }

        /*
            Black page while playing
        */

        body.playing {
            background: #000;
            padding: 0;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>ZenPlay</h1>

    <p class="subtitle">
        Simple, satisfying games.
    </p>

    <div class="games" id="games">
        Loading games...
    </div>

</div>

<!-- Game overlay -->

<div id="gameOverlay">

    <button id="exitButton">
        Exit
    </button>

    <iframe
        id="gameFrame"
        allow="fullscreen">
    </iframe>

</div>

<script>

const gamesContainer =
    document.getElementById("games");

const gameOverlay =
    document.getElementById("gameOverlay");

const gameFrame =
    document.getElementById("gameFrame");

let savedScrollPosition = 0;
let gameOpen = false;


/*
    Load games
*/

async function loadGames() {

    try {

        const response =
            await fetch("games.json");

        if (!response.ok) {
            throw new Error(
                "Could not load games.json"
            );
        }

        const data =
            await response.json();

        gamesContainer.innerHTML = "";

        data.games.forEach(game => {

            const card =
                document.createElement("div");

            card.className = "game";

            card.onclick = () => {
                openGame(game.file);
            };

            card.innerHTML = `
                <h2>${game.name}</h2>

                <p>
                    ${game.description}
                </p>

                <div class="game-info">
                    ${game.category} · ${game.type}
                </div>
            `;

            gamesContainer.appendChild(card);

        });

    } catch (error) {

        gamesContainer.innerHTML =
            "Unable to load games.";

        console.error(error);

    }
}


/*
    Update the absolute game overlay.

    Because the overlay is absolute, its top position
    must equal the scroll position from when the game
    was opened.
*/

function updateGameViewport() {

    if (!gameOpen) {
        return;
    }

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;

    /*
        Keep the overlay at the same document location
        as the viewport.
    */

    gameOverlay.style.left = "0px";

    gameOverlay.style.top =
        savedScrollPosition + "px";

    gameOverlay.style.width =
        width + "px";

    gameOverlay.style.height =
        height + "px";

    /*
        Explicitly resize the iframe too.
    */

    gameFrame.style.left = "0px";
    gameFrame.style.top = "0px";

    gameFrame.style.width =
        width + "px";

    gameFrame.style.height =
        height + "px";

    /*
        Force WebKit to recalculate the geometry.
    */

    void gameOverlay.offsetWidth;

    void gameOverlay.offsetHeight;

    gameOverlay.getBoundingClientRect();

    gameFrame.getBoundingClientRect();
}


/*
    Re-sync the absolute coordinate system.

    This is deliberately much simpler than the previous
    fixed-position rebuild approach.
*/

function resyncGameViewport() {

    if (!gameOpen) {
        return;
    }

    /*
        Wait until iOS has finished changing orientation.
    */

    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            updateGameViewport();

            /*
                One additional layout flush.
            */

            void document.body.offsetWidth;

            void gameOverlay.offsetWidth;

            gameOverlay.getBoundingClientRect();

            gameFrame.getBoundingClientRect();

        });

    });

}


/*
    Open game
*/

function openGame(file) {

    /*
        Save the exact document position.
    */

    savedScrollPosition =
        window.scrollY;

    gameOpen = true;

    /*
        Hide game cards.
    */

    gamesContainer.style.display =
        "none";

    /*
        Make the page black.
    */

    document.body.classList.add(
        "playing"
    );

    /*
        Prevent page scrolling while playing.
    */

    document.body.style.overflow =
        "hidden";

    /*
        Position the overlay before displaying it.
    */

    gameOverlay.style.display =
        "block";

    gameOverlay.style.left =
        "0px";

    gameOverlay.style.top =
        savedScrollPosition + "px";

    /*
        Load the game.
    */

    gameFrame.src = file;

    /*
        Set its initial dimensions.
    */

    updateGameViewport();

}


/*
    Close game
*/

function closeGame() {

    gameOpen = false;

    /*
        Stop the game.
    */

    gameFrame.src = "";

    /*
        Hide the game.
    */

    gameOverlay.style.display =
        "none";

    /*
        Restore the games.
    */

    gamesContainer.style.display =
        "";

    /*
        Restore normal page styling.
    */

    document.body.classList.remove(
        "playing"
    );

    /*
        Restore scrolling.
    */

    document.body.style.overflow =
        "";

    /*
        Restore the exact position
        from before the game opened.
    */

    requestAnimationFrame(() => {

        window.scrollTo(
            0,
            savedScrollPosition
        );

    });

}


/*
    Exit button

    Use pointerup as the primary event.

    click remains as a fallback.
*/

const exitButton =
    document.getElementById("exitButton");

let exitHandled = false;

exitButton.addEventListener(
    "pointerup",
    event => {

        event.preventDefault();

        if (exitHandled) {
            return;
        }

        exitHandled = true;

        closeGame();

        setTimeout(() => {
            exitHandled = false;
        }, 350);

    },
    {
        passive: false
    }
);

exitButton.addEventListener(
    "touchend",
    event => {

        event.preventDefault();

        if (exitHandled) {
            return;
        }

        exitHandled = true;

        closeGame();

        setTimeout(() => {
            exitHandled = false;
        }, 350);

    },
    {
        passive: false
    }
);

exitButton.addEventListener(
    "click",
    event => {

        event.preventDefault();

        if (exitHandled) {
            return;
        }

        exitHandled = true;

        closeGame();

        setTimeout(() => {
            exitHandled = false;
        }, 350);

    }
);


/*
    Orientation handling
*/

window.addEventListener(
    "orientationchange",
    () => {

        resyncGameViewport();

    }
);


/*
    Resize handling

    iOS can fire several resize events while
    completing a rotation.
*/

window.addEventListener(
    "resize",
    () => {

        if (!gameOpen) {
            return;
        }

        resyncGameViewport();

    }
);


/*
    visualViewport handling

    This catches another stage of iOS viewport
    adjustment during rotation.
*/

if (window.visualViewport) {

    window.visualViewport.addEventListener(
        "resize",
        () => {

            if (!gameOpen) {
                return;
            }

            resyncGameViewport();

        }
    );

}


/*
    Load the games.
*/

loadGames();

</script>

</body>
</html>
