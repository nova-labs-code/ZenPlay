
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101014">
<title>Loops</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: fixed;
    inset: 0;
    background: #101014;
    touch-action: none;
    overscroll-behavior: none;
}

canvas {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script src="./watermark.js" defer></script>

<script>
(() => {
"use strict";

const canvas = document.getElementById("canvas");

const ctx = canvas.getContext("2d", {
    alpha: false,
    desynchronized: true
});

let width = 0;
let height = 0;
let dpr = 1;

const strings = [];

let currentString = null;
let activePointer = null;

const SETTINGS = {
    pointSpacing: 7,
    maxPoints: 850,
    maxStrings: 24,

    physicsPasses: 2,
    constraintLength: 7,

    dragDamping: 0.985,
    releasedDamping: 0.996,

    lineWidth: 2.3,

    colorSpeed: 28
};

let previousTime = performance.now();
let elapsed = 0;

function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.75);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);

resize();

function createPoint(x, y) {
    return {
        x,
        y,
        px: x,
        py: y
    };
}

function createString(x, y) {
    return {
        points: [createPoint(x, y)],

        released: false,

        inputX: x,
        inputY: y,

        hue: Math.random() * 360,

        phase: Math.random() * Math.PI * 2,

        waveSpeed: 2 + Math.random() * 1.5,

        waveStrength: 7 + Math.random() * 3,

        driftX: 0,
        driftY: 0,

        driftPhase: Math.random() * Math.PI * 2,

        age: 0
    };
}

/*
 * Add smoothly spaced points along the finger's movement.
 */
function addPoint(s, x, y) {
    const points = s.points;
    const last = points[points.length - 1];

    const dx = x - last.x;
    const dy = y - last.y;

    const distance = Math.hypot(dx, dy);

    s.inputX = x;
    s.inputY = y;

    if (distance < SETTINGS.pointSpacing) return;

    const available = SETTINGS.maxPoints - points.length;

    if (available <= 0) return;

    const count = Math.min(
        Math.floor(distance / SETTINGS.pointSpacing),
        available
    );

    if (count <= 0) return;

    for (let i = 1; i <= count; i++) {
        const t = i / count;

        points.push(
            createPoint(
                last.x + dx * t,
                last.y + dy * t
            )
        );
    }
}

/*
 * String physics.
 */
function updateString(s, dt) {
    const points = s.points;
    const count = points.length;

    if (count < 2) return;

    const step = Math.min(dt, 0.033);

    if (s.released) {
        s.age += step;
        s.driftPhase += step * 0.8;
    }

    const damping = s.released
        ? SETTINGS.releasedDamping
        : SETTINGS.dragDamping;

    /*
     * Verlet movement with a stronger natural wave.
     */
    for (let i = 0; i < count; i++) {
        const p = points[i];

        if (!s.released && i === count - 1) {
            p.x = s.inputX;
            p.y = s.inputY;
            p.px = s.inputX;
            p.py = s.inputY;
            continue;
        }

        const vx = (p.x - p.px) * damping;
        const vy = (p.y - p.py) * damping;

        const oldX = p.x;
        const oldY = p.y;

        const progress = i / Math.max(1, count - 1);

        const wave =
            elapsed * s.waveSpeed +
            i * 0.11 +
            s.phase;

        /*
         * A traveling wave makes the string bend
         * rather than just wobble in place.
         */
        const waveStrength = s.released
            ? s.waveStrength * 0.5
            : s.waveStrength;

        const waveX =
            Math.sin(wave) * waveStrength;

        const waveY =
            Math.cos(wave * 0.75) * waveStrength;

        /*
         * Released strings drift slowly.
         */
        const driftX = s.released ? s.driftX : 0;
        const driftY = s.released ? s.driftY : 0;

        p.x = oldX + vx + waveX * step + driftX * step;
        p.y = oldY + vy + waveY * step + driftY * step;

        p.px = oldX;
        p.py = oldY;
    }

    /*
     * Keep the drawing endpoint attached to the finger.
     */
    if (!s.released) {
        const last = points[count - 1];

        last.x = s.inputX;
        last.y = s.inputY;

        last.px = s.inputX;
        last.py = s.inputY;
    }

    /*
     * Preserve the flexible string shape.
     */
    for (let pass = 0; pass < SETTINGS.physicsPasses; pass++) {
        for (let i = 0; i < count - 1; i++) {
            const a = points[i];
            const b = points[i + 1];

            const dx = b.x - a.x;
            const dy = b.y - a.y;

            const distance = Math.hypot(dx, dy) || 0.001;

            const difference =
                (distance - SETTINGS.constraintLength) / distance;

            const offsetX = dx * difference * 0.5;
            const offsetY = dy * difference * 0.5;

            const anchored =
                !s.released && i === count - 2;

            if (anchored) {
                a.x += offsetX * 2;
                a.y += offsetY * 2;
            } else {
                a.x += offsetX;
                a.y += offsetY;

                b.x -= offsetX;
                b.y -= offsetY;
            }
        }

        if (!s.released) {
            const last = points[count - 1];

            last.x = s.inputX;
            last.y = s.inputY;
        }
    }
}

/*
 * Draw the string using ONE solid color.
 * The entire string changes hue together.
 */
function drawString(s) {
    const points = s.points;

    if (points.length < 2) return;

    const count = points.length;

    const hue = (
        s.hue + elapsed * SETTINGS.colorSpeed
    ) % 360;

    const color = `hsl(${hue}, 95%, 66%)`;

    ctx.save();

    ctx.beginPath();

    /*
     * Add visible lateral movement to the shape.
     * The movement tapers toward the active endpoint
     * so it stays attached to the finger.
     */
    for (let i = 0; i < count; i++) {
        const p = points[i];

        const previous = points[Math.max(0, i - 1)];
        const next = points[Math.min(count - 1, i + 1)];

        const tangentX = next.x - previous.x;
        const tangentY = next.y - previous.y;

        const length = Math.hypot(tangentX, tangentY) || 1;

        const normalX = -tangentY / length;
        const normalY = tangentX / length;

        const wave =
            Math.sin(
                elapsed * 2.8 +
                i * 0.13 +
                s.phase
            );

        let amount = s.released ? 3.5 : 6.5;

        /*
         * More visible movement in the middle of the string.
         */
        const middleFactor = Math.sin(
            Math.PI * (i / Math.max(1, count - 1))
        );

        amount *= 0.45 + middleFactor * 0.65;

        /*
         * Keep the active endpoint visually anchored.
         */
        if (!s.released) {
            const endFactor = Math.min(
                1,
                (count - 1 - i) / 5
            );

            amount *= endFactor;
        }

        const x = p.x + normalX * wave * amount;
        const y = p.y + normalY * wave * amount;

        if (i === 0) {
            ctx.moveTo(x, y);
        } else {
            ctx.lineTo(x, y);
        }
    }

    ctx.strokeStyle = color;
    ctx.lineWidth = SETTINGS.lineWidth;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    /*
     * Soft glow.
     */
    ctx.shadowColor = color;
    ctx.shadowBlur = 5;

    ctx.stroke();

    /*
     * Small highlight.
     */
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(255,255,255,0.24)";
    ctx.lineWidth = 0.65;

    ctx.stroke();

    ctx.restore();
}

/*
 * Release the string into a slow, natural drift.
 */
function releaseString(s) {
    if (!s || s.released) return;

    s.released = true;

    const points = s.points;

    const first = points[0];
    const last = points[points.length - 1];

    const centerX = (first.x + last.x) * 0.5;
    const centerY = (first.y + last.y) * 0.5;

    let dx = centerX - width * 0.5;
    let dy = centerY - height * 0.5;

    const length = Math.hypot(dx, dy);

    if (length > 0.01) {
        dx /= length;
        dy /= length;
    } else {
        const angle = Math.random() * Math.PI * 2;

        dx = Math.cos(angle);
        dy = Math.sin(angle);
    }

    /*
     * Slightly randomize the direction.
     */
    const angle = (Math.random() - 0.5) * 0.65;

    const cos = Math.cos(angle);
    const sin = Math.sin(angle);

    const directionX = dx * cos - dy * sin;
    const directionY = dx * sin + dy * cos;

    /*
     * Slower drift: gentle movement instead of
     * immediately shooting away.
     */
    const speed = 7 + Math.random() * 6;

    s.driftX = directionX * speed;
    s.driftY = directionY * speed;

    for (let i = 0; i < points.length; i++) {
        const p = points[i];

        p.px = p.x;
        p.py = p.y;
    }
}

/*
 * Only remove a string when its entire length
 * has travelled beyond the screen.
 */
function isOffscreen(s) {
    const points = s.points;

    let minX = Infinity;
    let maxX = -Infinity;
    let minY = Infinity;
    let maxY = -Infinity;

    for (let i = 0; i < points.length; i++) {
        const p = points[i];

        minX = Math.min(minX, p.x);
        maxX = Math.max(maxX, p.x);

        minY = Math.min(minY, p.y);
        maxY = Math.max(maxY, p.y);
    }

    const margin = 40;

    return (
        maxX < -margin ||
        minX > width + margin ||
        maxY < -margin ||
        minY > height + margin
    );
}

/*
 * Pointer interaction.
 */
function startDrawing(event) {
    if (activePointer !== null) return;

    event.preventDefault();

    activePointer = event.pointerId;

    try {
        canvas.setPointerCapture(event.pointerId);
    } catch (_) {}

    currentString = createString(
        event.clientX,
        event.clientY
    );

    strings.push(currentString);
}

function moveDrawing(event) {
    if (event.pointerId !== activePointer) return;
    if (!currentString) return;

    event.preventDefault();

    addPoint(
        currentString,
        event.clientX,
        event.clientY
    );
}

function finishDrawing(event) {
    if (activePointer === null) return;

    if (
        event &&
        event.pointerId !== undefined &&
        event.pointerId !== activePointer
    ) {
        return;
    }

    if (currentString) {
        releaseString(currentString);
    }

    currentString = null;
    activePointer = null;
}

canvas.addEventListener("pointerdown", startDrawing, {
    passive: false
});

canvas.addEventListener("pointermove", moveDrawing, {
    passive: false
});

canvas.addEventListener("pointerup", finishDrawing);
canvas.addEventListener("pointercancel", finishDrawing);
canvas.addEventListener("lostpointercapture", finishDrawing);

/*
 * Main animation loop.
 */
function animate(now) {
    const dt = Math.min(
        (now - previousTime) / 1000,
        0.033
    );

    previousTime = now;
    elapsed += dt;

    ctx.fillStyle = "#101014";
    ctx.fillRect(0, 0, width, height);

    for (let i = strings.length - 1; i >= 0; i--) {
        const s = strings[i];

        updateString(s, dt);
        drawString(s);

        if (s.released && isOffscreen(s)) {
            strings.splice(i, 1);
        }
    }

    /*
     * Keep a reasonable memory and rendering limit.
     */
    while (strings.length > SETTINGS.maxStrings) {
        const index = strings.findIndex(s => s.released);

        if (index === -1) break;

        strings.splice(index, 1);
    }

    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

})();
</script>

</body>
</html>
