<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover">

    <title>Slime</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #06100c;
        }

        body {
            position: fixed;
            inset: 0;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            touch-action: none;
        }

        #slimeTexture {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            opacity: 0.6;
            pointer-events: none;
            z-index: 2;

            /*
                The image itself is distorted through
                CSS transforms generated from the slime
                movement.
            */
            transform-origin: center;
        }
    </style>
</head>

<body>

<canvas id="canvas"></canvas>

<img
    id="slimeTexture"
    src="Slime.png"
    alt=""
>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {
    alpha: false
});

const slimeTexture =
    document.getElementById("slimeTexture");

const CELL_SIZE = 6;

/*
    Interaction radius.

    10 simulation cells × 6px
    = roughly 60px around
    the finger.
*/
const RADIUS = 10;

let W = 0;
let H = 0;

let gridW = 0;
let gridH = 0;

let depth;
let nextDepth;

let imageData;
let pixels;

const pointer = {
    x: 0,
    y: 0,

    oldX: 0,
    oldY: 0,

    velocityX: 0,
    velocityY: 0,

    down: false
};


/* =========================
   RESIZE
========================= */

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W;
    canvas.height = H;

    gridW =
        Math.ceil(W / CELL_SIZE) + 1;

    gridH =
        Math.ceil(H / CELL_SIZE) + 1;

    depth =
        new Float32Array(
            gridW * gridH
        );

    nextDepth =
        new Float32Array(
            gridW * gridH
        );

    imageData =
        ctx.createImageData(
            W,
            H
        );

    pixels =
        imageData.data;
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =========================
   POINTER
========================= */

canvas.addEventListener(
    "pointerdown",
    e => {
        pointer.x = e.clientX;
        pointer.y = e.clientY;

        pointer.oldX = pointer.x;
        pointer.oldY = pointer.y;

        pointer.velocityX = 0;
        pointer.velocityY = 0;

        pointer.down = true;

        canvas.setPointerCapture(
            e.pointerId
        );
    }
);

canvas.addEventListener(
    "pointermove",
    e => {
        pointer.oldX = pointer.x;
        pointer.oldY = pointer.y;

        pointer.x = e.clientX;
        pointer.y = e.clientY;

        pointer.velocityX =
            pointer.x -
            pointer.oldX;

        pointer.velocityY =
            pointer.y -
            pointer.oldY;
    }
);

canvas.addEventListener(
    "pointerup",
    () => {
        pointer.down = false;
    }
);

canvas.addEventListener(
    "pointercancel",
    () => {
        pointer.down = false;
    }
);


/* =========================
   HELPERS
========================= */

function index(x, y) {
    return x + y * gridW;
}

function clamp(
    value,
    min,
    max
) {
    return Math.max(
        min,
        Math.min(max, value)
    );
}


/* =========================
   FINGER DEFORMATION
========================= */

function disturb() {
    if (!pointer.down) {
        return;
    }

    const centerX =
        pointer.x / CELL_SIZE;

    const centerY =
        pointer.y / CELL_SIZE;

    const minX =
        Math.max(
            1,
            Math.floor(
                centerX - RADIUS
            )
        );

    const maxX =
        Math.min(
            gridW - 2,
            Math.ceil(
                centerX + RADIUS
            )
        );

    const minY =
        Math.max(
            1,
            Math.floor(
                centerY - RADIUS
            )
        );

    const maxY =
        Math.min(
            gridH - 2,
            Math.ceil(
                centerY + RADIUS
            )
        );

    const speed =
        Math.sqrt(
            pointer.velocityX *
            pointer.velocityX +
            pointer.velocityY *
            pointer.velocityY
        );

    /*
        Faster finger movement
        creates stronger deformation.
    */
    const pressure =
        0.9 +
        Math.min(
            speed * 0.035,
            2.5
        );

    for (
        let y = minY;
        y <= maxY;
        y++
    ) {
        for (
            let x = minX;
            x <= maxX;
            x++
        ) {
            const dx =
                x - centerX;

            const dy =
                y - centerY;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );

            if (
                distance >
                RADIUS
            ) {
                continue;
            }

            /*
                Smooth falloff from
                the finger outward.
            */
            const influence =
                1 -
                distance / RADIUS;

            const amount =
                influence *
                influence *
                pressure;

            const i =
                index(x, y);

            /*
                Push the slime down.
            */
            depth[i] -=
                amount * 2.5;

            /*
                Drag the surrounding
                slime along with the finger.
            */
            if (speed > 0.5) {
                const direction =
                    (
                        dx *
                        pointer.velocityX +

                        dy *
                        pointer.velocityY
                    ) /
                    (distance + 1);

                depth[i] +=
                    direction *
                    influence *
                    0.025;
            }
        }
    }
}


/* =========================
   DEPTH PHYSICS
========================= */

function updateDepth() {
    disturb();

    for (
        let y = 1;
        y < gridH - 1;
        y++
    ) {
        for (
            let x = 1;
            x < gridW - 1;
            x++
        ) {
            const i =
                index(x, y);

            const center =
                depth[i];

            const left =
                depth[i - 1];

            const right =
                depth[i + 1];

            const up =
                depth[
                    i - gridW
                ];

            const down =
                depth[
                    i + gridW
                ];

            /*
                Spread deformation
                between neighboring cells.
            */
            const spread =
                left +
                right +
                up +
                down -
                center * 4;

            let velocity =
                spread * 0.27;

            /*
                Spring force slowly
                restores the slime.
            */
            velocity +=
                -center * 0.009;

            /*
                Higher damping makes
                the deformation settle
                slowly and smoothly.
            */
            velocity *= 0.94;

            nextDepth[i] =
                center +
                velocity;
        }
    }

    /*
        Keep the outer boundary
        at its original position.
    */
    for (
        let x = 0;
        x < gridW;
        x++
    ) {
        nextDepth[
            index(x, 0)
        ] = 0;

        nextDepth[
            index(
                x,
                gridH - 1
            )
        ] = 0;
    }

    for (
        let y = 0;
        y < gridH;
        y++
    ) {
        nextDepth[
            index(0, y)
        ] = 0;

        nextDepth[
            index(
                gridW - 1,
                y
            )
        ] = 0;
    }

    const temp =
        depth;

    depth =
        nextDepth;

    nextDepth =
        temp;
}


/* =========================
   DEPTH SAMPLING
========================= */

function sampleDepth(
    px,
    py
) {
    const gx =
        px / CELL_SIZE;

    const gy =
        py / CELL_SIZE;

    const x =
        Math.floor(gx);

    const y =
        Math.floor(gy);

    const fx =
        gx - x;

    const fy =
        gy - y;

    const x0 =
        clamp(
            x,
            0,
            gridW - 1
        );

    const x1 =
        clamp(
            x + 1,
            0,
            gridW - 1
        );

    const y0 =
        clamp(
            y,
            0,
            gridH - 1
        );

    const y1 =
        clamp(
            y + 1,
            0,
            gridH - 1
        );

    const a =
        depth[
            index(x0, y0)
        ];

    const b =
        depth[
            index(x1, y0)
        ];

    const c =
        depth[
            index(x0, y1)
        ];

    const d =
        depth[
            index(x1, y1)
        ];

    const top =
        a +
        (b - a) * fx;

    const bottom =
        c +
        (d - c) * fx;

    return (
        top +
        (bottom - top) * fy
    );
}


/* =========================
   SLIME RENDER
========================= */

function render() {
    const lightX =
        W * 0.28;

    const lightY =
        H * 0.18;

    const lightZ =
        300;

    for (
        let y = 0;
        y < H;
        y++
    ) {
        for (
            let x = 0;
            x < W;
            x++
        ) {
            const pixelIndex =
                y * W + x;

            const z =
                sampleDepth(
                    x,
                    y
                );

            /*
                Calculate the surface
                slope around this pixel.
            */
            const zLeft =
                sampleDepth(
                    x - 2,
                    y
                );

            const zRight =
                sampleDepth(
                    x + 2,
                    y
                );

            const zUp =
                sampleDepth(
                    x,
                    y - 2
                );

            const zDown =
                sampleDepth(
                    x,
                    y + 2
                );

            const slopeX =
                (
                    zRight -
                    zLeft
                ) * 0.5;

            const slopeY =
                (
                    zDown -
                    zUp
                ) * 0.5;

            let nx =
                -slopeX;

            let ny =
                -slopeY;

            let nz =
                3.2;

            const normalLength =
                Math.sqrt(
                    nx * nx +
                    ny * ny +
                    nz * nz
                );

            nx /=
                normalLength;

            ny /=
                normalLength;

            nz /=
                normalLength;

            /*
                Light direction.
            */
            let lx =
                lightX - x;

            let ly =
                lightY - y;

            let lz =
                lightZ;

            const lightLength =
                Math.sqrt(
                    lx * lx +
                    ly * ly +
                    lz * lz
                );

            lx /=
                lightLength;

            ly /=
                lightLength;

            lz /=
                lightLength;

            /*
                Diffuse lighting.
            */
            const diffuse =
                Math.max(
                    0,
                    nx * lx +
                    ny * ly +
                    nz * lz
                );

            /*
                Soft specular highlight.
            */
            const hx =
                lx;

            const hy =
                ly;

            const hz =
                lz + 1;

            const halfLength =
                Math.sqrt(
                    hx * hx +
                    hy * hy +
                    hz * hz
                );

            const halfX =
                hx / halfLength;

            const halfY =
                hy / halfLength;

            const halfZ =
                hz / halfLength;

            const specular =
                Math.pow(
                    Math.max(
                        0,
                        nx * halfX +
                        ny * halfY +
                        nz * halfZ
                    ),
                    28
                ) * 0.7;

            let brightness =
                0.27 +
                diffuse +
                specular;

            brightness +=
                clamp(
                    z * 0.008,
                    -0.22,
                    0.18
                );

            brightness =
                clamp(
                    brightness,
                    0.08,
                    1.6
                );

            const r =
                clamp(
                    Math.round(
                        10 *
                        brightness
                    ),
                    0,
                    255
                );

            const g =
                clamp(
                    Math.round(
                        150 *
                        brightness
                    ),
                    0,
                    255
                );

            const b =
                clamp(
                    Math.round(
                        68 *
                        brightness
                    ),
                    0,
                    255
                );

            const p =
                pixelIndex * 4;

            pixels[p] =
                r;

            pixels[p + 1] =
                g;

            pixels[p + 2] =
                b;

            pixels[p + 3] =
                255;
        }
    }

    ctx.putImageData(
        imageData,
        0,
        0
    );
}


/* =========================
   DEFORM SLIME.PNG
========================= */

function deformTexture() {
    /*
        Calculate the overall deformation
        around the current finger position.

        This changes the texture's scale,
        position and skew so Slime.png
        visually follows the slime.
    */

    if (!pointer.down) {
        /*
            Slowly return the image
            to its normal shape.
        */
        slimeTexture.style.transform =
            "translate3d(0px, 0px, 0px) " +
            "scale(1, 1) " +
            "skew(0deg, 0deg)";

        return;
    }

    const centerDepth =
        sampleDepth(
            pointer.x,
            pointer.y
        );

    const leftDepth =
        sampleDepth(
            pointer.x - 30,
            pointer.y
        );

    const rightDepth =
        sampleDepth(
            pointer.x + 30,
            pointer.y
        );

    const upDepth =
        sampleDepth(
            pointer.x,
            pointer.y - 30
        );

    const downDepth =
        sampleDepth(
            pointer.x,
            pointer.y + 30
        );

    /*
        Amount of deformation.
    */
    const strength =
        clamp(
            -centerDepth * 0.012,
            0,
            0.18
        );

    /*
        Horizontal and vertical
        surface differences.
    */
    const horizontal =
        rightDepth -
        leftDepth;

    const vertical =
        downDepth -
        upDepth;

    /*
        Make the image compress
        around the pressed area.
    */
    const scaleX =
        1 -
        strength * 0.12;

    const scaleY =
        1 -
        strength * 0.18;

    /*
        Slightly follow the deformation
        direction.
    */
    const skewX =
        clamp(
            horizontal * 0.015,
            -4,
            4
        );

    const skewY =
        clamp(
            vertical * 0.015,
            -4,
            4
        );

    /*
        The image moves very slightly
        toward the pressed surface.
    */
    const moveX =
        clamp(
            horizontal * 0.25,
            -12,
            12
        );

    const moveY =
        clamp(
            vertical * 0.25,
            -12,
            12
        );

    slimeTexture.style.transform =
        "translate3d(" +
        moveX +
        "px, " +
        moveY +
        "px, 0px) " +
        "scale(" +
        scaleX +
        ", " +
        scaleY +
        ") " +
        "skew(" +
        skewX +
        "deg, " +
        skewY +
        "deg)";
}


/* =========================
   ANIMATION
========================= */

function animate() {
    pointer.velocityX *= 0.72;
    pointer.velocityY *= 0.72;

    updateDepth();

    render();

    deformTexture();

    requestAnimationFrame(
        animate
    );
}

animate();
</script>

</body>
</html>
