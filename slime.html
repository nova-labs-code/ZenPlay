<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<title>Slime</title>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #07110d;
    touch-action: none;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {
    alpha: false
});

const surface = document.createElement("canvas");
const surfaceCtx = surface.getContext("2d", {
    alpha: false
});

let width = 0;
let height = 0;
let dpr = 1;

const spacing = 12;
const renderScale = 3;

let cols = 0;
let rows = 0;
let points = [];

const pointer = {
    x: 0,
    y: 0,
    lastX: 0,
    lastY: 0,
    vx: 0,
    vy: 0,
    active: false
};


/* ==============================
   RESIZE
============================== */

function resize() {

    dpr = Math.min(
        window.devicePixelRatio || 1,
        2
    );

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    surface.width =
        Math.ceil(width / renderScale);

    surface.height =
        Math.ceil(height / renderScale);

    buildGrid();
}

window.addEventListener(
    "resize",
    resize
);


/* ==============================
   INVISIBLE PHYSICS GRID
============================== */

function buildGrid() {

    cols =
        Math.ceil(width / spacing) + 2;

    rows =
        Math.ceil(height / spacing) + 2;

    points =
        new Array(cols * rows);

    for (let y = 0; y < rows; y++) {

        for (let x = 0; x < cols; x++) {

            const px =
                (x - 1) * spacing;

            const py =
                (y - 1) * spacing;

            points[
                y * cols + x
            ] = {

                x: px,
                y: py,

                baseX: px,
                baseY: py,

                vx: 0,
                vy: 0,

                z: 0,
                vz: 0
            };
        }
    }
}


/* ==============================
   POINTER
============================== */

function pointerMove(x, y) {

    if (!pointer.active) {

        pointer.x = x;
        pointer.y = y;

        pointer.lastX = x;
        pointer.lastY = y;

        return;
    }

    pointer.lastX = pointer.x;
    pointer.lastY = pointer.y;

    pointer.x = x;
    pointer.y = y;

    pointer.vx =
        x - pointer.lastX;

    pointer.vy =
        y - pointer.lastY;
}


canvas.addEventListener(
    "pointerdown",
    e => {

        pointer.active = true;

        pointer.x = e.clientX;
        pointer.y = e.clientY;

        pointer.lastX = pointer.x;
        pointer.lastY = pointer.y;

        pointer.vx = 0;
        pointer.vy = 0;

        canvas.setPointerCapture?.(
            e.pointerId
        );
    }
);


canvas.addEventListener(
    "pointermove",
    e => {

        pointerMove(
            e.clientX,
            e.clientY
        );
    }
);


canvas.addEventListener(
    "pointerup",
    () => {

        pointer.active = false;
    }
);


canvas.addEventListener(
    "pointercancel",
    () => {

        pointer.active = false;
    }
);


/* ==============================
   SLIME PHYSICS
============================== */

function update() {

    for (
        let y = 1;
        y < rows - 1;
        y++
    ) {

        for (
            let x = 1;
            x < cols - 1;
            x++
        ) {

            const i =
                y * cols + x;

            const p =
                points[i];

            const left =
                points[i - 1];

            const right =
                points[i + 1];

            const up =
                points[i - cols];

            const down =
                points[i + cols];


            /* --------------------------
               FLOW BETWEEN NEIGHBORS
            -------------------------- */

            const avgVX =
                (
                    left.vx +
                    right.vx +
                    up.vx +
                    down.vx
                ) * 0.25;

            const avgVY =
                (
                    left.vy +
                    right.vy +
                    up.vy +
                    down.vy
                ) * 0.25;


            p.vx +=
                (avgVX - p.vx) *
                0.075;

            p.vy +=
                (avgVY - p.vy) *
                0.075;


            /* --------------------------
               RETURN TO REST
            -------------------------- */

            p.vx +=
                (p.baseX - p.x) *
                0.012;

            p.vy +=
                (p.baseY - p.y) *
                0.012;


            /* --------------------------
               TOUCH / MOUSE FLOW
            -------------------------- */

            if (pointer.active) {

                const dx =
                    p.x - pointer.x;

                const dy =
                    p.y - pointer.y;

                const distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );

                const radius = 165;

                if (distance < radius) {

                    const raw =
                        1 -
                        distance / radius;

                    const influence =
                        raw *
                        raw *
                        (3 - 2 * raw);


                    let nx = 0;
                    let ny = 0;

                    if (distance > 0.001) {

                        nx =
                            dx / distance;

                        ny =
                            dy / distance;
                    }


                    /*
                        Main flow.
                    */

                    p.vx +=
                        pointer.vx *
                        influence *
                        0.24;

                    p.vy +=
                        pointer.vy *
                        influence *
                        0.24;


                    /*
                        Slight outward movement.
                    */

                    p.vx +=
                        nx *
                        influence *
                        0.22;

                    p.vy +=
                        ny *
                        influence *
                        0.22;


                    /*
                        Deform surface.
                    */

                    p.vz -=
                        influence *
                        0.85;
                }
            }


            /* --------------------------
               MOTION DAMPING
            -------------------------- */

            p.vx *= 0.91;
            p.vy *= 0.91;

            p.x += p.vx;
            p.y += p.vy;


            /* --------------------------
               DEPTH FLOW
            -------------------------- */

            const avgZ =
                (
                    left.z +
                    right.z +
                    up.z +
                    down.z
                ) * 0.25;

            const avgVZ =
                (
                    left.vz +
                    right.vz +
                    up.vz +
                    down.vz
                ) * 0.25;


            p.vz +=
                (avgVZ - p.vz) *
                0.055;

            p.vz +=
                (avgZ - p.z) *
                0.13;


            /*
                Slowly flatten.
            */

            p.vz -=
                p.z *
                0.045;

            p.vz *= 0.88;

            p.z += p.vz;

            p.z =
                Math.max(
                    -55,
                    Math.min(55, p.z)
                );
        }
    }


    pointer.vx *= 0.65;
    pointer.vy *= 0.65;
}


/* ==============================
   HEIGHT SAMPLING
============================== */

function sampleHeight(x, y) {

    const gx =
        x / spacing + 1;

    const gy =
        y / spacing + 1;

    let x0 =
        Math.floor(gx);

    let y0 =
        Math.floor(gy);

    x0 =
        Math.max(
            0,
            Math.min(
                cols - 2,
                x0
            )
        );

    y0 =
        Math.max(
            0,
            Math.min(
                rows - 2,
                y0
            )
        );

    const x1 =
        x0 + 1;

    const y1 =
        y0 + 1;

    const tx =
        gx - x0;

    const ty =
        gy - y0;

    const z00 =
        points[
            y0 * cols + x0
        ].z;

    const z10 =
        points[
            y0 * cols + x1
        ].z;

    const z01 =
        points[
            y1 * cols + x0
        ].z;

    const z11 =
        points[
            y1 * cols + x1
        ].z;


    const a =
        z00 +
        (z10 - z00) * tx;

    const b =
        z01 +
        (z11 - z01) * tx;


    return (
        a +
        (b - a) * ty
    );
}


/* ==============================
   DEFORMATION NORMAL
============================== */

function getNormal(x, y) {

    const step = 7;

    const left =
        sampleHeight(
            x - step,
            y
        );

    const right =
        sampleHeight(
            x + step,
            y
        );

    const up =
        sampleHeight(
            x,
            y - step
        );

    const down =
        sampleHeight(
            x,
            y + step
        );


    const dx =
        (right - left) /
        (step * 2);

    const dy =
        (down - up) /
        (step * 2);


    /*
        The normal comes ONLY from
        the deformation.

        There is no corner light.
    */

    let nx =
        -dx * 2.7;

    let ny =
        -dy * 2.7;

    let nz = 1;


    const length =
        Math.sqrt(
            nx * nx +
            ny * ny +
            nz * nz
        );


    nx /= length;
    ny /= length;
    nz /= length;


    return {
        x: nx,
        y: ny,
        z: nz
    };
}


/* ==============================
   DEFORMATION SHADING
============================== */

function render() {

    const sw =
        surface.width;

    const sh =
        surface.height;

    const image =
        surfaceCtx.createImageData(
            sw,
            sh
        );

    const data =
        image.data;


    for (
        let py = 0;
        py < sh;
        py++
    ) {

        for (
            let px = 0;
            px < sw;
            px++
        ) {

            const x =
                px * renderScale;

            const y =
                py * renderScale;


            const z =
                sampleHeight(
                    x,
                    y
                );


            const normal =
                getNormal(
                    x,
                    y
                );


            /*
                Lighting is based on the
                deformation normal.

                This is a simple material
                response rather than a
                fixed corner light.
            */

            const nx =
                normal.x;

            const ny =
                normal.y;

            const nz =
                normal.z;


            /*
                Soft directional response
                derived from the surface
                orientation.

                No light object is drawn.
            */

            const directional =
                Math.max(
                    0,
                    nx * -0.35 +
                    ny * -0.55 +
                    nz * 0.75
                );


            const underside =
                Math.max(
                    0,
                    -nx * 0.30 +
                    -ny * 0.15 +
                    nz * 0.25
                );


            /*
                Gloss appears where the
                surface is facing upward.
            */

            const gloss =
                Math.pow(
                    Math.max(
                        0,
                        nz
                    ),
                    12
                );


            /*
                Deeper deformation is darker.
            */

            const depth =
                z / 55;


            let brightness =
                0.35 +
                directional * 0.55 +
                underside * 0.12 +
                depth * 0.10 +
                gloss * 0.12;


            brightness =
                Math.max(
                    0.10,
                    Math.min(
                        1.15,
                        brightness
                    )
                );


            /*
                Base slime.
            */

            let r = 20;
            let g = 138;
            let b = 58;


            /*
                Raised areas become a little
                brighter.
            */

            if (z > 0) {

                const raised =
                    Math.min(
                        1,
                        z / 55
                    );

                r +=
                    raised * 12;

                g +=
                    raised * 18;

                b +=
                    raised * 7;
            }


            /*
                Indented areas become richer.
            */

            if (z < 0) {

                const deep =
                    Math.min(
                        1,
                        -z / 55
                    );

                r *=
                    1 -
                    deep * 0.18;

                g *=
                    1 -
                    deep * 0.22;

                b *=
                    1 -
                    deep * 0.14;
            }


            r *= brightness;
            g *= brightness;
            b *= brightness;


            /*
                Very subtle deformation
                highlight.
            */

            const highlight =
                gloss *
                Math.max(
                    0,
                    1 -
                    Math.abs(
                        normal.x
                    )
                );


            r +=
                highlight * 18;

            g +=
                highlight * 24;

            b +=
                highlight * 15;


            const index =
                (
                    py * sw +
                    px
                ) * 4;


            data[index] =
                Math.min(
                    255,
                    r
                );

            data[index + 1] =
                Math.min(
                    255,
                    g
                );

            data[index + 2] =
                Math.min(
                    255,
                    b
                );

            data[index + 3] =
                255;
        }
    }


    surfaceCtx.putImageData(
        image,
        0,
        0
    );


    /* ==========================
       FINAL SCREEN
    ========================== */

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    ctx.imageSmoothingEnabled =
        true;

    ctx.drawImage(
        surface,
        0,
        0,
        width,
        height
    );
}


/* ==============================
   LOOP
============================== */

function loop() {

    update();
    render();

    requestAnimationFrame(
        loop
    );
}


/* ==============================
   START
============================== */

resize();
loop();

</script>

</body>
</html>
