<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<title>Slime</title>

<style>
    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #07110d;
        touch-action: none;
    }

    canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
    }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {
    alpha: false
});

let W = 0;
let H = 0;

const CELL_SIZE = 6;
const RADIUS = 10;

let gridW = 0;
let gridH = 0;

let depth = [];
let velocity = [];

let pointerX = 0;
let pointerY = 0;

let touching = false;
let lastTime = performance.now();

const slimeImage = new Image();
slimeImage.src = "Slime.png";

let imageCanvas = document.createElement("canvas");
let imageCtx = imageCanvas.getContext("2d");

let imageReady = false;

slimeImage.onload = () => {
    imageCanvas.width = W || window.innerWidth;
    imageCanvas.height = H || window.innerHeight;

    drawImageToBuffer();
    imageReady = true;
};

function drawImageToBuffer() {
    if (!slimeImage.complete || slimeImage.naturalWidth === 0) {
        return;
    }

    imageCanvas.width = W;
    imageCanvas.height = H;

    imageCtx.clearRect(0, 0, W, H);

    /*
        The image is fitted once to the screen.

        It never gets translated, scaled, rotated,
        or moved as a whole.

        Only the texture sampling is deformed later.
    */
    const imageRatio =
        slimeImage.naturalWidth / slimeImage.naturalHeight;

    const screenRatio = W / H;

    let drawWidth;
    let drawHeight;

    if (imageRatio > screenRatio) {
        drawHeight = H;
        drawWidth = H * imageRatio;
    } else {
        drawWidth = W;
        drawHeight = W / imageRatio;
    }

    const x = (W - drawWidth) * 0.5;
    const y = (H - drawHeight) * 0.5;

    imageCtx.drawImage(
        slimeImage,
        x,
        y,
        drawWidth,
        drawHeight
    );
}

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    gridW = Math.ceil(W / CELL_SIZE) + 1;
    gridH = Math.ceil(H / CELL_SIZE) + 1;

    depth = new Float32Array(gridW * gridH);
    velocity = new Float32Array(gridW * gridH);

    drawImageToBuffer();
}

window.addEventListener("resize", resize);

resize();


/* --------------------------------------------------
   POINTER
-------------------------------------------------- */

function updatePointer(e) {
    const rect = canvas.getBoundingClientRect();

    pointerX = e.clientX - rect.left;
    pointerY = e.clientY - rect.top;
}

canvas.addEventListener("pointerdown", e => {
    touching = true;

    updatePointer(e);

    canvas.setPointerCapture?.(e.pointerId);
});

canvas.addEventListener("pointermove", e => {
    updatePointer(e);
});

canvas.addEventListener("pointerup", e => {
    touching = false;

    try {
        canvas.releasePointerCapture?.(e.pointerId);
    } catch {}
});

canvas.addEventListener("pointercancel", () => {
    touching = false;
});


/* --------------------------------------------------
   DEPTH SIMULATION
-------------------------------------------------- */

function index(x, y) {
    return y * gridW + x;
}

function simulate(dt) {

    const nextVelocity = velocity;

    /*
        When touching:

        The finger continuously pushes
        the slime downward.

        There is intentionally NO spring-back
        while the finger is held.
    */
    if (touching) {

        const cx = pointerX / CELL_SIZE;
        const cy = pointerY / CELL_SIZE;

        const minX = Math.max(
            1,
            Math.floor(cx - RADIUS)
        );

        const maxX = Math.min(
            gridW - 2,
            Math.ceil(cx + RADIUS)
        );

        const minY = Math.max(
            1,
            Math.floor(cy - RADIUS)
        );

        const maxY = Math.min(
            gridH - 2,
            Math.ceil(cy + RADIUS)
        );

        for (let y = minY; y <= maxY; y++) {

            for (let x = minX; x <= maxX; x++) {

                const dx = x - cx;
                const dy = y - cy;

                const distance =
                    Math.sqrt(dx * dx + dy * dy);

                if (distance > RADIUS) {
                    continue;
                }

                const falloff =
                    1 - distance / RADIUS;

                const smoothFalloff =
                    falloff * falloff *
                    (3 - 2 * falloff);

                const i = index(x, y);

                /*
                    Push down while held.

                    Velocity is intentionally not
                    springing back here.
                */
                nextVelocity[i] -=
                    smoothFalloff *
                    0.55 *
                    dt;

                /*
                    Direct depth keeps the finger
                    visibly pressed into the slime.
                */
                depth[i] -=
                    smoothFalloff *
                    0.045;
            }
        }
    }

    /*
        Neighbor spreading.

        This makes the deformation travel
        through nearby slime instead of behaving
        like independent pixels.
    */

    const spread = 0.18;

    for (let y = 1; y < gridH - 1; y++) {

        for (let x = 1; x < gridW - 1; x++) {

            const i = index(x, y);

            const average =
                (
                    depth[index(x - 1, y)] +
                    depth[index(x + 1, y)] +
                    depth[index(x, y - 1)] +
                    depth[index(x, y + 1)]
                ) * 0.25;

            const difference =
                average - depth[i];

            nextVelocity[i] +=
                difference * spread * dt;
        }
    }

    /*
        Only after release:

        spring force pulls the slime back
        toward its original surface.

        The damping is tuned so the deformation
        settles in roughly two seconds.
    */

    if (!touching) {

        const spring = 3.8;
        const damping = 4.8;

        for (let i = 0; i < depth.length; i++) {

            const force =
                -depth[i] * spring;

            nextVelocity[i] +=
                force * dt;

            nextVelocity[i] *=
                Math.exp(-damping * dt);
        }
    } else {

        /*
            While holding, still damp movement
            slightly so the slime doesn't explode
            outward from accumulated velocity.
        */

        for (let i = 0; i < velocity.length; i++) {
            nextVelocity[i] *= 0.94;
        }
    }

    /*
        Integrate velocity.
    */

    for (let i = 0; i < depth.length; i++) {
        depth[i] += nextVelocity[i] * dt;
    }

    /*
        Stable outer edge.
    */

    for (let x = 0; x < gridW; x++) {

        depth[index(x, 0)] = 0;
        depth[index(x, gridH - 1)] = 0;

        velocity[index(x, 0)] = 0;
        velocity[index(x, gridH - 1)] = 0;
    }

    for (let y = 0; y < gridH; y++) {

        depth[index(0, y)] = 0;
        depth[index(gridW - 1, y)] = 0;

        velocity[index(0, y)] = 0;
        velocity[index(gridW - 1, y)] = 0;
    }
}


/* --------------------------------------------------
   DEPTH SAMPLING
-------------------------------------------------- */

function sampleDepth(px, py) {

    const gx = px / CELL_SIZE;
    const gy = py / CELL_SIZE;

    const x0 = Math.floor(gx);
    const y0 = Math.floor(gy);

    const x1 = Math.min(x0 + 1, gridW - 1);
    const y1 = Math.min(y0 + 1, gridH - 1);

    const fx = gx - x0;
    const fy = gy - y0;

    const a = depth[index(
        Math.max(0, x0),
        Math.max(0, y0)
    )];

    const b = depth[index(
        x1,
        Math.max(0, y0)
    )];

    const c = depth[index(
        Math.max(0, x0),
        y1
    )];

    const d = depth[index(
        x1,
        y1
    )];

    const top =
        a + (b - a) * fx;

    const bottom =
        c + (d - c) * fx;

    return top + (bottom - top) * fy;
}


/* --------------------------------------------------
   IMAGE DEFORMATION
-------------------------------------------------- */

function drawDeformedImage() {

    if (!imageReady) {
        return;
    }

    /*
        Draw the image into a temporary pixel buffer.

        The image's original screen position stays fixed.

        We only change which source pixel gets sampled.
    */

    const source =
        imageCtx.getImageData(
            0,
            0,
            W,
            H
        );

    const output =
        ctx.createImageData(W, H);

    const src = source.data;
    const dst = output.data;

    for (let y = 0; y < H; y++) {

        for (let x = 0; x < W; x++) {

            /*
                Local depth gradient.

                This gives us the direction in which
                the slime surface is being pushed.
            */

            const left =
                sampleDepth(
                    Math.max(0, x - CELL_SIZE),
                    y
                );

            const right =
                sampleDepth(
                    Math.min(W, x + CELL_SIZE),
                    y
                );

            const up =
                sampleDepth(
                    x,
                    Math.max(0, y - CELL_SIZE)
                );

            const down =
                sampleDepth(
                    x,
                    Math.min(H, y + CELL_SIZE)
                );

            const dx =
                right - left;

            const dy =
                down - up;

            /*
                Local displacement.

                This is intentionally small.

                It bends the image locally instead
                of moving the entire image.
            */

            const strength = 8.0;

            let sourceX =
                x - dx * strength;

            let sourceY =
                y - dy * strength;

            /*
                Add a small compression/expansion
                based on the depth itself.

                Still completely local.
            */

            const d =
                sampleDepth(x, y);

            const localScale =
                Math.max(
                    0.72,
                    Math.min(
                        1.28,
                        1 + d * 0.045
                    )
                );

            sourceX =
                x + (sourceX - x) * localScale;

            sourceY =
                y + (sourceY - y) * localScale;

            sourceX = Math.max(
                0,
                Math.min(W - 1, sourceX)
            );

            sourceY = Math.max(
                0,
                Math.min(H - 1, sourceY)
            );

            const sx =
                Math.floor(sourceX);

            const sy =
                Math.floor(sourceY);

            const sourceIndex =
                (sy * W + sx) * 4;

            const outputIndex =
                (y * W + x) * 4;

            dst[outputIndex] =
                src[sourceIndex];

            dst[outputIndex + 1] =
                src[sourceIndex + 1];

            dst[outputIndex + 2] =
                src[sourceIndex + 2];

            /*
                60% image opacity.
            */

            dst[outputIndex + 3] =
                Math.floor(
                    src[sourceIndex + 3] * 0.6
                );
        }
    }

    ctx.putImageData(
        output,
        0,
        0
    );
}


/* --------------------------------------------------
   GREEN SLIME
-------------------------------------------------- */

function drawSlime() {

    /*
        Render the green slime itself.

        No screen blending.
        No flashing.
        No glossy streak.
    */

    const image =
        ctx.createImageData(W, H);

    const pixels = image.data;

    const lightX =
        touching
            ? pointerX
            : W * 0.35;

    const lightY =
        touching
            ? pointerY
            : H * 0.28;

    for (let y = 0; y < H; y++) {

        for (let x = 0; x < W; x++) {

            const d =
                sampleDepth(x, y);

            const left =
                sampleDepth(
                    Math.max(0, x - CELL_SIZE),
                    y
                );

            const right =
                sampleDepth(
                    Math.min(W, x + CELL_SIZE),
                    y
                );

            const up =
                sampleDepth(
                    x,
                    Math.max(0, y - CELL_SIZE)
                );

            const down =
                sampleDepth(
                    x,
                    Math.min(H, y + CELL_SIZE)
                );

            const nx =
                -(right - left) * 2.0;

            const ny =
                -(down - up) * 2.0;

            const nz = 1;

            const length =
                Math.sqrt(
                    nx * nx +
                    ny * ny +
                    nz * nz
                );

            const normalX =
                nx / length;

            const normalY =
                ny / length;

            const normalZ =
                nz / length;

            let lx =
                lightX - x;

            let ly =
                lightY - y;

            const lightDistance =
                Math.sqrt(
                    lx * lx +
                    ly * ly
                ) || 1;

            lx /= lightDistance;
            ly /= lightDistance;

            const diffuse =
                Math.max(
                    0,
                    normalX * lx +
                    normalY * ly +
                    normalZ * 0.75
                );

            const light =
                0.55 +
                diffuse * 0.45;

            /*
                Green slime palette.
            */

            let r =
                18 * light;

            let g =
                125 * light;

            let b =
                48 * light;

            /*
                Slightly darken pressed areas.
            */

            const pressed =
                Math.max(
                    0,
                    Math.min(
                        1,
                        -d * 0.12
                    )
                );

            r *= 1 - pressed * 0.15;
            g *= 1 - pressed * 0.08;
            b *= 1 - pressed * 0.12;

            const i =
                (y * W + x) * 4;

            pixels[i] =
                Math.max(0, Math.min(255, r));

            pixels[i + 1] =
                Math.max(0, Math.min(255, g));

            pixels[i + 2] =
                Math.max(0, Math.min(255, b));

            pixels[i + 3] =
                255;
        }
    }

    ctx.putImageData(
        image,
        0,
        0
    );
}


/* --------------------------------------------------
   FRAME
-------------------------------------------------- */

function frame(now) {

    let dt =
        (now - lastTime) / 1000;

    lastTime = now;

    /*
        Prevent huge physics jumps after
        switching apps or tabs.
    */

    dt =
        Math.min(dt, 0.033);

    simulate(dt);

    /*
        Green slime first.
    */

    drawSlime();

    /*
        Image sits on top.

        Its overall position never changes.

        Only its local texture coordinates
        are deformed by the slime surface.
    */

    drawDeformedImage();

    requestAnimationFrame(frame);
}

requestAnimationFrame(frame);

</script>

</body>
</html>
