<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover">

    <title>Slime</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #06100c;
        }

        body {
            position: fixed;
            inset: 0;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            touch-action: none;
        }
    </style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d", {
        alpha: false
    });

const texture =
    new Image();

texture.src = "Slime.png";

let W = 0;
let H = 0;

const CELL_SIZE = 6;

/*
    10 cells × 6px
    = approximately 60px
    of finger influence.
*/
const RADIUS = 10;


/* =========================
   DEPTH FIELD
========================= */

let gridW = 0;
let gridH = 0;

let depth;
let velocity;
let nextDepth;
let nextVelocity;


/* =========================
   TEXTURE CANVAS
========================= */

const textureCanvas =
    document.createElement("canvas");

const textureCtx =
    textureCanvas.getContext("2d");


/* =========================
   POINTER
========================= */

const pointer = {
    x: 0,
    y: 0,

    lastX: 0,
    lastY: 0,

    vx: 0,
    vy: 0,

    down: false
};


/* =========================
   TIME
========================= */

let lastTime =
    performance.now();


/* =========================
   RESIZE
========================= */

function resize() {

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W;
    canvas.height = H;

    textureCanvas.width = W;
    textureCanvas.height = H;

    gridW =
        Math.ceil(W / CELL_SIZE) + 1;

    gridH =
        Math.ceil(H / CELL_SIZE) + 1;

    const size =
        gridW * gridH;

    depth =
        new Float32Array(size);

    velocity =
        new Float32Array(size);

    nextDepth =
        new Float32Array(size);

    nextVelocity =
        new Float32Array(size);
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =========================
   POINTER EVENTS
========================= */

canvas.addEventListener(
    "pointerdown",
    e => {

        pointer.x = e.clientX;
        pointer.y = e.clientY;

        pointer.lastX =
            pointer.x;

        pointer.lastY =
            pointer.y;

        pointer.vx = 0;
        pointer.vy = 0;

        pointer.down = true;

        canvas.setPointerCapture(
            e.pointerId
        );
    }
);

canvas.addEventListener(
    "pointermove",
    e => {

        pointer.lastX =
            pointer.x;

        pointer.lastY =
            pointer.y;

        pointer.x =
            e.clientX;

        pointer.y =
            e.clientY;

        pointer.vx =
            pointer.x -
            pointer.lastX;

        pointer.vy =
            pointer.y -
            pointer.lastY;
    }
);

canvas.addEventListener(
    "pointerup",
    () => {
        pointer.down = false;
    }
);

canvas.addEventListener(
    "pointercancel",
    () => {
        pointer.down = false;
    }
);


/* =========================
   HELPERS
========================= */

function idx(x, y) {
    return x + y * gridW;
}

function clamp(
    value,
    min,
    max
) {
    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );
}


/* =========================
   FINGER PRESS
========================= */

function pressSlime() {

    if (!pointer.down) {
        return;
    }

    const gx =
        pointer.x / CELL_SIZE;

    const gy =
        pointer.y / CELL_SIZE;

    const minX =
        Math.max(
            1,
            Math.floor(
                gx - RADIUS
            )
        );

    const maxX =
        Math.min(
            gridW - 2,
            Math.ceil(
                gx + RADIUS
            )
        );

    const minY =
        Math.max(
            1,
            Math.floor(
                gy - RADIUS
            )
        );

    const maxY =
        Math.min(
            gridH - 2,
            Math.ceil(
                gy + RADIUS
            )
        );

    const speed =
        Math.sqrt(
            pointer.vx *
            pointer.vx +
            pointer.vy *
            pointer.vy
        );

    for (
        let y = minY;
        y <= maxY;
        y++
    ) {

        for (
            let x = minX;
            x <= maxX;
            x++
        ) {

            const dx =
                x - gx;

            const dy =
                y - gy;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );

            if (
                distance >
                RADIUS
            ) {
                continue;
            }

            const falloff =
                1 -
                distance / RADIUS;

            /*
                Smooth rounded influence.
            */
            const influence =
                falloff *
                falloff;

            const i =
                idx(x, y);

            /*
                Push downward.
            */
            velocity[i] -=
                influence *
                (
                    0.055 +
                    Math.min(
                        speed * 0.002,
                        0.045
                    )
                );
        }
    }
}


/* =========================
   DEPTH SIMULATION
========================= */

function simulate(dt) {

    pressSlime();

    /*
        Normalize time so physics
        behaves consistently at
        different frame rates.
    */
    const timeScale =
        Math.min(
            dt * 60,
            2
        );

    /*
        These values are deliberately
        gentle so the slime doesn't
        violently bounce.
    */
    const spreadStrength =
        0.18;

    /*
        Strong enough to restore the
        slime in roughly 2 seconds.
    */
    const returnStrength =
        0.025;

    /*
        Damping prevents endless
        bouncing.
    */
    const damping =
        Math.pow(
            0.90,
            timeScale
        );

    for (
        let y = 1;
        y < gridH - 1;
        y++
    ) {

        for (
            let x = 1;
            x < gridW - 1;
            x++
        ) {

            const i =
                idx(x, y);

            const center =
                depth[i];

            const left =
                depth[i - 1];

            const right =
                depth[i + 1];

            const up =
                depth[
                    i - gridW
                ];

            const down =
                depth[
                    i + gridW
                ];

            /*
                Neighbor spreading.
            */
            const average =
                (
                    left +
                    right +
                    up +
                    down
                ) * 0.25;

            const spread =
                average -
                center;

            velocity[i] +=
                spread *
                spreadStrength *
                timeScale;

            /*
                Slowly pull the slime
                back to its original
                surface.
            */
            velocity[i] +=
                -center *
                returnStrength *
                timeScale;

            velocity[i] *=
                damping;

            nextDepth[i] =
                center +
                velocity[i] *
                timeScale;

            nextVelocity[i] =
                velocity[i];

            /*
                Prevent extreme
                deformation.
            */
            nextDepth[i] =
                clamp(
                    nextDepth[i],
                    -4,
                    2
                );
        }
    }

    /*
        Fixed edges.
    */
    for (
        let x = 0;
        x < gridW;
        x++
    ) {

        nextDepth[
            idx(x, 0)
        ] = 0;

        nextDepth[
            idx(
                x,
                gridH - 1
            )
        ] = 0;

        nextVelocity[
            idx(x, 0)
        ] = 0;

        nextVelocity[
            idx(
                x,
                gridH - 1
            )
        ] = 0;
    }

    for (
        let y = 0;
        y < gridH;
        y++
    ) {

        nextDepth[
            idx(0, y)
        ] = 0;

        nextDepth[
            idx(
                gridW - 1,
                y
            )
        ] = 0;

        nextVelocity[
            idx(0, y)
        ] = 0;

        nextVelocity[
            idx(
                gridW - 1,
                y
            )
        ] = 0;
    }

    const oldDepth =
        depth;

    depth =
        nextDepth;

    nextDepth =
        oldDepth;

    const oldVelocity =
        velocity;

    velocity =
        nextVelocity;

    nextVelocity =
        oldVelocity;
}


/* =========================
   SAMPLE DEPTH
========================= */

function sampleDepth(
    px,
    py
) {

    const gx =
        px / CELL_SIZE;

    const gy =
        py / CELL_SIZE;

    const x =
        Math.floor(gx);

    const y =
        Math.floor(gy);

    const fx =
        gx - x;

    const fy =
        gy - y;

    const x0 =
        clamp(
            x,
            0,
            gridW - 1
        );

    const x1 =
        clamp(
            x + 1,
            0,
            gridW - 1
        );

    const y0 =
        clamp(
            y,
            0,
            gridH - 1
        );

    const y1 =
        clamp(
            y + 1,
            0,
            gridH - 1
        );

    const a =
        depth[
            idx(x0, y0)
        ];

    const b =
        depth[
            idx(x1, y0)
        ];

    const c =
        depth[
            idx(x0, y1)
        ];

    const d =
        depth[
            idx(x1, y1)
        ];

    const top =
        a +
        (b - a) * fx;

    const bottom =
        c +
        (d - c) * fx;

    return (
        top +
        (bottom - top) * fy
    );
}


/* =========================
   DRAW BASE SLIME
========================= */

function drawBase() {

    const pixels =
        ctx.createImageData(
            W,
            H
        );

    const data =
        pixels.data;

    for (
        let y = 0;
        y < H;
        y++
    ) {

        for (
            let x = 0;
            x < W;
            x++
        ) {

            const z =
                sampleDepth(
                    x,
                    y
                );

            /*
                Surface slope.
            */
            const left =
                sampleDepth(
                    x - 3,
                    y
                );

            const right =
                sampleDepth(
                    x + 3,
                    y
                );

            const up =
                sampleDepth(
                    x,
                    y - 3
                );

            const down =
                sampleDepth(
                    x,
                    y + 3
                );

            const nx =
                -(right - left);

            const ny =
                -(down - up);

            /*
                Gentle lighting.
            */
            const light =
                clamp(
                    0.48 -
                    nx * 0.7 -
                    ny * 0.7 +
                    z * 0.018,
                    0.18,
                    0.95
                );

            const p =
                (
                    y * W +
                    x
                ) * 4;

            data[p] =
                Math.round(
                    7 * light
                );

            data[p + 1] =
                Math.round(
                    125 * light
                );

            data[p + 2] =
                Math.round(
                    55 * light
                );

            data[p + 3] =
                255;
        }
    }

    ctx.putImageData(
        pixels,
        0,
        0
    );
}


/* =========================
   WARP SLIME.PNG
========================= */

function drawDeformedTexture() {

    if (!texture.complete) {
        return;
    }

    /*
        Draw the original image into
        a temporary canvas first.
    */
    textureCtx.clearRect(
        0,
        0,
        W,
        H
    );

    const sourceRatio =
        texture.naturalWidth /
        texture.naturalHeight;

    const screenRatio =
        W / H;

    let drawW;
    let drawH;
    let offsetX;
    let offsetY;

    /*
        Same "cover" behavior as
        the original fullscreen image.
    */
    if (
        sourceRatio >
        screenRatio
    ) {

        drawH = H;
        drawW =
            H * sourceRatio;

        offsetX =
            (W - drawW) * 0.5;

        offsetY = 0;

    } else {

        drawW = W;
        drawH =
            W / sourceRatio;

        offsetX = 0;

        offsetY =
            (H - drawH) * 0.5;
    }

    textureCtx.drawImage(
        texture,
        offsetX,
        offsetY,
        drawW,
        drawH
    );


    /*
        Instead of moving the image,
        we sample the image from a
        displaced position.

        Every pixel looks at the
        slime depth around it.

        This creates true local
        warping.
    */
    const source =
        textureCtx.getImageData(
            0,
            0,
            W,
            H
        );

    const output =
        ctx.createImageData(
            W,
            H
        );

    const src =
        source.data;

    const dst =
        output.data;

    for (
        let y = 0;
        y < H;
        y++
    ) {

        for (
            let x = 0;
            x < W;
            x++
        ) {

            const z =
                sampleDepth(
                    x,
                    y
                );

            /*
                Calculate the direction
                the surface is sloping.
            */
            const left =
                sampleDepth(
                    x - 8,
                    y
                );

            const right =
                sampleDepth(
                    x + 8,
                    y
                );

            const up =
                sampleDepth(
                    x,
                    y - 8
                );

            const down =
                sampleDepth(
                    x,
                    y + 8
                );

            const slopeX =
                right -
                left;

            const slopeY =
                down -
                up;

            /*
                Larger displacement
                near a deformed area,
                but zero when normal.
            */
            const warpStrength =
                5.5;

            /*
                Pull the texture in the
                direction of the surface
                deformation.

                IMPORTANT:
                This changes local pixels,
                NOT the position of the
                entire image.
            */
            const sourceX =
                Math.round(
                    x +
                    slopeX *
                    warpStrength
                );

            const sourceY =
                Math.round(
                    y +
                    slopeY *
                    warpStrength
                );

            const sx =
                clamp(
                    sourceX,
                    0,
                    W - 1
                );

            const sy =
                clamp(
                    sourceY,
                    0,
                    H - 1
                );

            const sourceIndex =
                (
                    sy * W +
                    sx
                ) * 4;

            const outputIndex =
                (
                    y * W +
                    x
                ) * 4;

            /*
                Keep Slime.png at 60%.
            */
            dst[outputIndex] =
                src[sourceIndex];

            dst[outputIndex + 1] =
                src[sourceIndex + 1];

            dst[outputIndex + 2] =
                src[sourceIndex + 2];

            dst[outputIndex + 3] =
                Math.round(
                    src[sourceIndex + 3] *
                    0.6
                );
        }
    }

    /*
        Draw only the warped texture
        over the slime.

        The image itself has not
        translated or scaled.
    */
    ctx.putImageData(
        output,
        0,
        0
    );
}


/* =========================
   ANIMATION
========================= */

function animate(now) {

    const dt =
        Math.min(
            (now - lastTime) / 1000,
            0.033
        );

    lastTime =
        now;

    /*
        Finger velocity slowly fades.
    */
    pointer.vx *= 0.65;
    pointer.vy *= 0.65;

    simulate(dt);

    /*
        Base slime.
    */
    drawBase();

    /*
        Deformed Slime.png.
    */
    drawDeformedTexture();

    requestAnimationFrame(
        animate
    );
}

requestAnimationFrame(
    animate
);
</script>

</body>
</html>
